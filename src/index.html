<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Audiator</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --bg-color: #282c34;
            --primary-color: #3e4452;
            --secondary-color: #333842;
            --text-color: #abb2bf;
            --border-color: #4b5263;
            --accent-color: #61afef;
            --record-color: #e06c75;
            --main-font-family: 'Arial', sans-serif;
            --main-font-size: 16px;
        }

        body.light-theme {
            --bg-color: #fafafa;
            --primary-color: #e4e6eb;
            --secondary-color: #ffffff;
            --text-color: #1c1e21;
            --border-color: #d1d5db;
        }

        body {
            font-family: var(--main-font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }

        .title-bar {
            -webkit-app-region: drag;
            height: 32px;
            background-color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .title-bar-button {
            -webkit-app-region: no-drag;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        .title-bar-button:hover {
            background-color: var(--border-color);
        }

        .main-content {
            padding-top: 32px;
            flex-grow: 1;
            min-height: 0; /* the history gives way (and scrolls), not the panels below */
            overflow-y: auto;
            position: relative;
        }
        
        .history-container {
            padding: 15px;
        }

        .history-entry {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--primary-color);
        }

        /* The recording's date, and at the right — over the copy button — a
           play button that opens its sound file in the player Windows has. */
        .entry-header {
            font-size: 0.8em;
            color: var(--text-color);
            margin-bottom: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .entry-date { flex: 1 1 auto; min-width: 0; opacity: 0.6; }
        .entry-play {
            flex: 0 0 auto; width: 22px; height: 16px; padding: 0; margin: 0;
            background: none; border: none; cursor: pointer;
            color: var(--text-color); opacity: 0.45;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .entry-play:hover { opacity: 1; }
        .entry-play[hidden] { display: none; }
        .entry-play svg { width: 10px; height: 10px; }

        .original-text {
            font-size: var(--main-font-size);
            margin-bottom: 10px;
            user-select: text; /* Allow selecting text */
            word-break: break-word; /* Break long words */
            overflow-wrap: break-word; /* For modern browsers */
        }
        
        .translated-text {
            font-family: var(--main-font-family); /* Inherit font family */
            font-size: calc(var(--main-font-size) * 0.9); /* Relative font size */
            color: var(--accent-color);
            padding-left: 10px;
            border-left: 2px solid var(--accent-color);
            user-select: text; /* Allow selecting text */
            word-break: break-word; /* Break long words */
            overflow-wrap: break-word; /* For modern browsers */
        }

        /* Free plan: time left and when it renews, between the menu and the
           window buttons; red once it is used up. Cut with "…" if a language
           makes it too long. It is part of the title bar the window is moved
           by: it spans nearly all of it, and marking it "no-drag" (for a
           tooltip) left the window impossible to move. */
        .minutes-left {
            position: absolute; left: 40px; right: 64px; text-align: center;
            font-size: 12px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            -webkit-app-region: drag; pointer-events: none;
        }
        .minutes-left.empty { color: var(--record-color); opacity: 1; }

        /* Speech model downloading / loading / failed: a strip under the title
           bar; the history moves down while it is there. */
        .engine-banner {
            position: fixed; top: 32px; left: 0; right: 0; z-index: 99;
            padding: 6px 12px 7px; font-size: 12px;
            background: var(--primary-color); border-bottom: 1px solid var(--border-color);
        }
        .engine-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        /* One line; a long error is cut with "…" and shown whole on hover. */
        #engine-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .engine-retry {
            flex: 0 0 auto; background: none; color: var(--text-color); cursor: pointer;
            border: 1px solid var(--border-color); border-radius: 4px; padding: 2px 8px; font-size: 12px;
        }
        .engine-progress-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .engine-progress {
            flex: 1 1 auto; height: 4px; border-radius: 2px; overflow: hidden;
            background: var(--border-color);
        }
        /* Stop the download: the user may not want it after all. */
        .engine-cancel {
            flex: 0 0 auto; background: none; border: none; padding: 0 2px; cursor: pointer;
            color: var(--text-color); font-size: 13px; line-height: 1; opacity: 0.7;
        }
        .engine-cancel:hover { opacity: 1; color: #e06c75; } /* red, like deleting a model */
        .engine-banner.loading .engine-cancel { display: none; }
        .engine-progress i { display: block; height: 100%; width: 0; background: var(--accent-color); transition: width 0.3s; }
        .engine-banner.loading .engine-progress i { width: 100%; animation: pending-blink 1.1s steps(4) infinite; }
        .engine-banner.error .engine-progress-row { display: none; }

        /* Translation panel (on-demand languages). */
        .translate-panel {
            /* Keeps its height however long the history grows (it used to be
               squeezed a little more with every new transcript until it
               vanished); scrolls inside when it has more than fits. */
            flex: 0 0 auto;
            display: flex; flex-direction: column; gap: 6px; max-height: min(320px, 55vh); overflow-y: auto;
            padding: 8px 15px 10px; border-top: 1px solid var(--accent-color); font-size: 13px;
        }
        .translate-panel.hidden { display: none; }
        .tp-head { display: flex; align-items: center; gap: 8px; }
        .tp-title { flex: 1 1 auto; min-width: 0; font-size: 0.9em; opacity: 0.8; }
        .tp-reset {
            flex: 0 0 auto; padding: 2px 8px; font-size: 12px; cursor: pointer;
            background: none; color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px;
            opacity: 0.8; user-select: none;
        }
        .tp-reset:hover { opacity: 1; border-color: var(--accent-color); }
        /* The language the Translate button translates into: framed like the
           chosen quality in Settings. */
        .tp-lang.tp-default { border-color: var(--accent-color); }
        .tp-lang.tp-default .tp-name { color: var(--accent-color); }
        .tp-list { display: flex; flex-direction: column; gap: 3px; }
        /* At most three rows of each list in view (the rest scroll inside it),
           so a long list of languages does not push the text out of sight;
           favourites come first, so they are the ones in view. */
        .tp-row { flex: 0 0 auto; box-sizing: border-box; height: 32px; }
        #tp-installed, #tp-job, #tp-results { max-height: 102px; overflow-y: auto; }
        /* With downloads or search results showing too, two rows of each. */
        .translate-panel.compact #tp-installed,
        .translate-panel.compact #tp-job,
        .translate-panel.compact #tp-results { max-height: 67px; }
        .tp-list::-webkit-scrollbar { width: 8px; }
        .tp-list::-webkit-scrollbar-track { background: #3e4452; }
        .tp-list::-webkit-scrollbar-thumb { background: #4a5060; }
        .tp-list::-webkit-scrollbar-thumb:hover { background: #565d6f; }
        .tp-list::-webkit-scrollbar-button { display: none; }
        body.light-theme .tp-list::-webkit-scrollbar-track { background: #e7eaf2; }
        body.light-theme .tp-list::-webkit-scrollbar-thumb { background: #dcdee3; }
        /* Favourite: a grey star that turns yellow; favourites are listed first. */
        .tp-star {
            flex: 0 0 auto; width: 18px; padding: 0; font-size: 14px; line-height: 1;
            background: none; border: none; color: var(--text-color); cursor: pointer; opacity: 0.35;
        }
        .tp-star:hover { opacity: 0.8; }
        .tp-star.on { color: #e5c07b; opacity: 1; }
        .tp-list:empty { display: none; }
        .tp-row {
            display: flex; align-items: center; gap: 8px; padding: 2px 6px;
            background: var(--primary-color); border: 1px solid var(--border-color); border-radius: 4px;
        }
        .tp-lang:hover { border-color: var(--accent-color); }
        .tp-name {
            flex: 1 1 auto; min-width: 0; padding: 3px 0; text-align: left; font-size: 14px;
            background: none; border: none; color: var(--text-color); cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        span.tp-name { cursor: default; }
        .tp-size { font-size: 12px; opacity: 0.7; white-space: nowrap; }
        .tp-icon {
            flex: 0 0 auto; width: 18px; height: 18px; padding: 0; display: inline-flex;
            align-items: center; justify-content: center; font-size: 12px;
            background: none; border: none; color: var(--text-color); cursor: pointer; opacity: 0.7;
        }
        span.tp-icon { cursor: default; }
        .tp-icon svg { width: 16px; height: 16px; }
        button.tp-delete:hover, button.tp-cancel:hover { opacity: 1; color: #e06c75; }
        button.tp-download:hover { opacity: 1; color: var(--accent-color); }
        .tp-progress { flex: 1 1 auto; height: 4px; border-radius: 2px; overflow: hidden; background: var(--border-color); }
        .tp-progress i { display: block; height: 100%; width: 0; background: var(--accent-color); transition: width 0.3s; }
        .tp-installing .tp-progress i { width: 100%; animation: pending-blink 1.1s steps(4) infinite; }
        .tp-note { font-size: 12px; color: var(--record-color); }
        .tp-empty { font-size: 12px; opacity: 0.6; padding: 2px 6px; }
        .tp-search {
            padding: 5px 8px; font-size: 13px; border-radius: 4px;
            background: var(--secondary-color); color: var(--text-color); border: 1px solid var(--border-color);
        }

        /* A recording waiting for or in transcription: blinks like the bar's
           red "transcribing" barrel. Endless animations here move in a few
           steps, not smoothly: the window is semi-transparent, and redrawing
           it every frame cost a good part of a CPU core, taken from the
           transcription itself (see recorder-overlay.html). */
        .original-text.pending {
            color: var(--record-color);
            animation: pending-blink 1.1s steps(4) infinite;
        }
        @keyframes pending-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        /* A copy button beside each text in the history: one click puts that
           text on the clipboard, no selecting needed (selecting still works).
           Hidden while the text is a status or an error. */
        .text-row { display: flex; align-items: flex-start; gap: 6px; }
        .text-row > .original-text, .text-row > .translated-text { flex: 1 1 auto; min-width: 0; }
        .entry-copy {
            flex: 0 0 auto; background: none; border: none; padding: 0 2px;
            cursor: pointer; font-size: 14px; line-height: 1.4;
            color: var(--text-color); opacity: 0.45;
        }
        .entry-copy:hover { opacity: 1; }
        /* The copy button, and under it (on a transcript) a box to pick it for
           translation. */
        .entry-actions { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        /* The box that picks a text for translation: an outline in the text's
           colour, not a white square that caught the eye on the grey. Picked,
           it is filled like the title bar with a tick in the text's colour —
           the app's own look, in both themes (users' suggestion). */
        .entry-check {
            -webkit-appearance: none; appearance: none; margin: 0; cursor: pointer;
            width: 14px; height: 14px; border-radius: 3px; box-sizing: border-box;
            border: 1.5px solid var(--text-color); background: transparent; opacity: 0.6;
            display: inline-grid; place-content: center;
        }
        .entry-check:hover { opacity: 0.9; }
        /* The tick in the light grey of the title bar's text: in the dark theme
           that is the text colour itself; in the light one a softer grey than
           the near-black text (user: "light grey, like the top bar"). */
        :root { --tick-color: var(--text-color); }
        body.light-theme { --tick-color: #80858e; }
        .entry-check:checked { background: var(--primary-color); border-color: var(--tick-color); opacity: 1; }
        .entry-check:checked::after {
            content: ''; width: 3px; height: 7px; margin-top: -2px;
            border: solid var(--tick-color); border-width: 0 2px 2px 0; transform: rotate(45deg);
        }
        .entry-check[hidden] { display: none; }
        .entry-copy[hidden] { display: none; }

        .scroll-buttons {
            position: fixed; /* Positioned relative to main-content */
            bottom: 160px;    /* Increased from 120px to accommodate translate bar */
            right: 20px;     /* 20px from the right of main-content */
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }

        .scroll-buttons:hover {
            opacity: 1; /* Fully opaque on hover */
        }

        .scroll-button {
            background-color: var(--secondary-color); /* Button background */
            border: none;
            border-radius: 50%; /* Circular buttons */
            width: 30px;      /* Button size (40px - 25% = 30px) */
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); /* Subtle shadow */
            transition: background-color 0.2s ease;
            -webkit-app-region: no-drag; /* Ensure buttons are clickable in Electron */
        }

        .scroll-button:hover {
            background-color: var(--primary-color); /* Darker on hover */
        }

        .scroll-button svg {
            color: var(--text-color); /* Icon color */
            width: 18px;      /* Icon size (24px - 25% = 18px) */
            height: 18px;
        }

        .controls {
            flex-shrink: 0; /* never squeezed by a long history */
            position: relative; /* Needed for absolute positioning of the canvas */
            padding: 10px 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-button {
            background: var(--primary-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 5px;
            padding: 8px 10px; /* 10, not 12: frees room for longer labels (AUD-33) */
            cursor: pointer;
            font-size: 1.2em;
        }
        .control-button:hover {
            background-color: var(--border-color);
        }
        .control-button:active {
            transform: translateY(1px);
            background-color: var(--secondary-color);
        }
        .control-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        #record-btn { color: var(--record-color); }
        .hidden { display: none; }

        /* Brief confirmation strip, e.g. after the transcript is copied. */
        #toast {
            position: fixed; left: 50%; transform: translateX(-50%);
            bottom: 74px; z-index: 2000; max-width: 88%;
            background: #23262e; color: #cfd3dc; border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px; padding: 7px 12px; font-size: 12px; text-align: center; white-space: pre-line; /* a second line: where a file went */
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        #toast.show { opacity: 1; }

        /* The record button shows the floating bar's microphone in the same soft
           red: still while idle, slowly breathing while recording, so the window
           and the bar say "recording" the same way. (A tiny live equaliser here
           was hard to notice, a blinking red dot too harsh; the level meter
           lives on the bar.) */
        .mic-icon {
            display: inline-block; vertical-align: middle; width: 20px; height: 20px;
            color: var(--record-color);
        }
        #stop-btn .mic-icon { animation: rec-pulse 1.4s steps(4) infinite; }
        /* While recording, the bar's green level meter under the microphone too,
           inside the button: the blinking alone was not obvious to people
           seeing the app for the first time. */
        /* As wide as the microphone and centred under it; a muted green, and the
           microphone's own red when loud (no yellow: it did not show on the
           light theme); breathing with the microphone. */
        :root { --meter-green: #5fba67; }
        body.light-theme { --meter-green: #4ea859; }
        /* Two blocks, each centred by its margins. Not a column flex: a button
           in Chromium is a flex box inside already, and a column there put the
           microphone and the meter at the left edge (user's screenshot). */
        #stop-btn .mic-icon { display: block; width: 18px; height: 18px; margin: 0 auto; }
        .btn-eq {
            display: flex; align-items: flex-end; justify-content: center; gap: 1px;
            width: 20px; height: 8px; margin: 2px auto 0;
            animation: rec-pulse 1.4s steps(4) infinite;
        }
        .btn-eq i { display: block; flex: 0 0 2px; height: 2px; border-radius: 1px; background: var(--meter-green); }
        @keyframes rec-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
        
        /* One row, four buttons of one width — record, save, translate, copy
           (user's wish 2026-10-05) — one height, in every language (AUD-33).
           The group around record/save/translate does not take part in the
           layout (display: contents): all four share the row equally, and the
           stop button takes the record button's place while recording. Nothing
           wraps; a translate label too long for its quarter is scaled down by
           the script (fitTranslateLabel). The height is fixed: left to the
           content it followed the font (40px for Latin/Cyrillic, 42px for
           Chinese). Buttons centre their content vertically on their own. */
        .control-button { white-space: nowrap; }
        #main-controls { display: contents; }
        /* The same starting width for all (not 0: buttons count their border in
           it, the translate group has none, and from 0 the group came out 1px
           narrower), then the row shared out equally. */
        .controls > #copy-btn, #main-controls > .control-button, #translate-group {
            flex: 1 1 40px; min-width: 0; height: 43px; box-sizing: border-box;
        }
        .icon-button { padding: 0; }
        /* Translate: the button translates the latest text (or the ticked ones)
           straight into the language chosen once — its code under the label —
           and the narrow arrow beside it opens the list of languages to choose
           another. One frame around both, like a single button. */
        #translate-group { display: flex; }
        #translate-group > .control-button { height: 100%; box-sizing: border-box; }
        #translate-btn {
            flex: 1 1 auto; min-width: 0; padding: 0 3px; overflow: hidden;
            border-radius: 5px 0 0 5px; line-height: 1.15;
        }
        /* Smaller than the icons' 1.2em: a quarter of the row holds the label
           beside the arrow ("Перевести" at 15px is ~66px; the script shrinks it
           further when a font or language needs it). */
        .tb-label { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
        .tb-lang { display: block; font-size: 10px; letter-spacing: 0.5px; opacity: 0.7; }
        .tb-lang:empty { display: none; }
        #translate-pick {
            flex: 0 0 16px; padding: 0; border-left: none; border-radius: 0 5px 5px 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        #translate-pick svg { width: 10px; height: 10px; opacity: 0.8; }
        #translate-pick.open { background-color: var(--border-color); }


        
        .dropdown-menu {
            position: fixed;
            top: 32px;
            left: 5px;
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            z-index: 101;
            -webkit-app-region: no-drag;
        }
        .dropdown-menu-item {
            padding: 10px 15px;
            cursor: pointer;
        }
        .dropdown-menu-item:hover {
            background-color: var(--primary-color);
        }

        /* Стили для полосы прокрутки — одинаковые у истории и у панели перевода */
        .main-content::-webkit-scrollbar,
        .translate-panel::-webkit-scrollbar {
            width: 12px;
        }

        .main-content::-webkit-scrollbar-track,
        .translate-panel::-webkit-scrollbar-track {
            background: #3e4452;
            border-radius: 0;
        }

        .main-content::-webkit-scrollbar-thumb,
        .translate-panel::-webkit-scrollbar-thumb {
            background: #4a5060;
            border-radius: 0;
        }

        .main-content::-webkit-scrollbar-thumb:hover,
        .translate-panel::-webkit-scrollbar-thumb:hover {
            background: #565d6f;
        }

        /* Убираем стрелки прокрутки */
        .main-content::-webkit-scrollbar-button,
        .translate-panel::-webkit-scrollbar-button {
            display: none;
        }

        /* Стили для светлой темы */
        body.light-theme .main-content::-webkit-scrollbar-track,
        body.light-theme .translate-panel::-webkit-scrollbar-track {
            background: #e7eaf2;
        }

        body.light-theme .main-content::-webkit-scrollbar-thumb,
        body.light-theme .translate-panel::-webkit-scrollbar-thumb {
            background: #dcdee3;
        }

        body.light-theme .main-content::-webkit-scrollbar-thumb:hover,
        body.light-theme .translate-panel::-webkit-scrollbar-thumb:hover {
            background: #c5c7cc;
        }

    </style>
</head>
<body>
    <div class="title-bar">
        <div>
            <div class="title-bar-button" id="menu-btn">&#9776;</div>
        </div>
        <!-- Free plan: transcription time left today (unlimited plans: hidden). -->
        <div id="minutes-left" class="minutes-left hidden"></div>
        <div style="display: flex;">
            <div class="title-bar-button" id="minimize-btn" style="font-size: 10px;">&#128469;</div>
            <div class="title-bar-button" id="close-btn">&#10005;</div>
        </div>
    </div>
    
    <div id="engine-banner" class="engine-banner hidden">
        <div class="engine-line">
            <span id="engine-text"></span>
            <button type="button" id="engine-retry" class="engine-retry hidden" data-i18n="engine.retry">Повторить</button>
        </div>
        <div class="engine-progress-row">
            <div class="engine-progress"><i id="engine-bar"></i></div>
            <button type="button" id="engine-cancel" class="engine-cancel" title="Остановить скачивание" data-i18n-title="engine.cancel">&#10005;</button>
        </div>
    </div>

    <div id="app-menu" class="dropdown-menu hidden">
        <div class="dropdown-menu-item" id="settings-btn" data-i18n="menu.settings">Настройки</div>
        <div class="dropdown-menu-item" id="save-all-btn" data-i18n="menu.saveAll">Сохранить весь текст</div>
        <div class="dropdown-menu-item" id="clear-all-btn" data-i18n="menu.clearHistory">Очистить историю</div>
        <div class="dropdown-menu-item" id="contact-btn" data-i18n="menu.contact">Написать нам</div>
        <div class="dropdown-menu-item" id="exit-btn" data-i18n="menu.exit">Выход</div>
    </div>

    <div class="main-content" id="main-content">
        <div class="history-container">
            <!-- Entries will be added here -->
        </div>
        <!-- Old scroll buttons removed -->
    </div>

    <div class="scroll-buttons">
        <button id="scroll-up" class="scroll-button">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </button>
        <button id="scroll-down" class="scroll-button">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </button>
    </div>


    <div id="toast"></div>

    <!-- Translation: the languages on this computer (click one to translate the
         latest text into it; a cross deletes it), and a search to add more —
         each download shows its size, can be stopped, and lands in the list. -->
    <div id="translate-bar" class="translate-panel hidden">
        <div class="tp-head">
            <div class="tp-title" id="tp-title">Перевести на:</div>
            <button type="button" id="tp-reset" class="tp-reset" data-i18n="translate.reset" data-i18n-title="translate.resetHint" title="Нажатие — снять все отметки. Двойное нажатие — убрать все переводы">Сбросить</button>
            <button type="button" id="tp-close" class="tp-icon tp-cancel" data-i18n-title="translate.close" title="Закрыть">&#10005;</button>
        </div>
        <div id="tp-installed" class="tp-list"></div>
        <div id="tp-job" class="tp-list"></div>
        <div id="tp-note" class="tp-note hidden"></div>
        <input id="tp-search" class="tp-search" type="text" autocomplete="off" spellcheck="false">
        <div id="tp-results" class="tp-list"></div>
    </div>

    <div class="controls">
        <div id="main-controls">
            <button class="control-button icon-button" id="record-btn" title="Запись (Ctrl+Space)" data-i18n-title="title.record">
                <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
                    <path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
                </svg>
            </button>
            <button class="control-button icon-button hidden" id="stop-btn" title="Стоп (Ctrl+Space)" data-i18n-title="title.stop">
                <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
                    <path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
                </svg>
                <span class="btn-eq" id="btn-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            </button>
            <!-- The sound of every recording is saved by itself (▶ in the history);
                 this saves texts: the latest, or the ticked ones, a file each. -->
            <button class="control-button icon-button" id="save-btn" title="Сохранить последний текст или выбранные" data-i18n-title="title.save" disabled>&#128190;</button> <!-- Floppy Disk -->
            <div id="translate-group">
                <button class="control-button" id="translate-btn" title="Перевести последний текст или выбранные" data-i18n-title="title.translate" disabled><span class="tb-label" data-i18n="btn.translate">Перевести</span><span class="tb-lang" id="tb-lang"></span></button>
                <button class="control-button" id="translate-pick" title="Выбрать язык перевода" data-i18n-title="translate.pick"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3 L5 7 L9 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
        </div>
        <button class="control-button icon-button" id="copy-btn" title="Копировать" data-i18n-title="title.copyLatest">&#128203;</button> <!-- Clipboard -->
    </div>

    <script>
        // --- Interface language (AUD-33) ---
        // Strings come from the main process (i18n.js). S() falls back to the
        // key itself so a missing string is visible instead of blank.
        let STR = {};
        const S = (key) => (STR[key] !== undefined ? STR[key] : key);
        function applyI18n() {
            return window.api.getI18n().then((i18n) => {
                STR = i18n.strings;
                document.documentElement.lang = i18n.lang;
                document.querySelectorAll('[data-i18n]').forEach((el) => {
                    const s = STR[el.dataset.i18n];
                    if (s !== undefined) el.textContent = s;
                });
                document.querySelectorAll('[data-i18n-title]').forEach((el) => {
                    const s = STR[el.dataset.i18nTitle];
                    if (s !== undefined) el.title = s;
                });
                fitTranslateLabel();
                renderEngine(lastEngine); // its text is built in code, not marked up
                renderAccount();
                relabelHistory();
            }).catch((e) => console.error('i18n load failed', e));
        }

        // Keep the translate label whole on its button whatever the language or
        // font: shrink it a pixel at a time, only when it does not fit (a wide
        // font such as Verdana, or a long word such as "Übersetzen").
        function fitTranslateLabel() {
            const b = document.querySelector('#translate-btn .tb-label');
            b.style.fontSize = ''; // start from the stylesheet size every time
            let size = parseFloat(getComputedStyle(b).fontSize);
            const floor = size * 0.75;
            while (b.scrollWidth > b.clientWidth && size > floor) {
                size -= 1;
                b.style.fontSize = size + 'px';
            }
        }
        applyI18n().then(() => restoreHistory());

        // --- DOM Elements ---
        const closeBtn = document.getElementById('close-btn');
        const minimizeBtn = document.getElementById('minimize-btn');
        const menuBtn = document.getElementById('menu-btn');
        const exitBtn = document.getElementById('exit-btn');
        const appMenu = document.getElementById('app-menu');
        const recordBtn = document.getElementById('record-btn');
        const stopBtn = document.getElementById('stop-btn');
        const saveBtn = document.getElementById('save-btn');
        const translateBtn = document.getElementById('translate-btn');
        const translatePick = document.getElementById('translate-pick');
        const mainContent = document.getElementById('main-content');
        const scrollUpBtn = document.getElementById('scroll-up');
        const scrollDownBtn = document.getElementById('scroll-down');
        const copyBtn = document.getElementById('copy-btn');
        const saveAllBtn = document.getElementById('save-all-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const historyContainer = document.querySelector('.history-container');
        const translateBar = document.getElementById('translate-bar');

        // --- State ---
        let mediaRecorder; // the recording in progress, if any

        // --- Recording level meter + global hotkey (AUD-40) ---
        // Uses setInterval, not requestAnimationFrame: recording usually runs with
        // this window hidden in the tray, and Chromium stops rAF in hidden windows,
        // which froze the overlay meter.
        let _meterCtx = null, _meterTimer = null;

        // Short-lived confirmation inside the window. When the window is hidden
        // (the usual hotkey flow) the overlay shows the same message instead.
        let _toastTimer = null;
        function showToast(message, ms = 2200) {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.classList.add('show');
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => el.classList.remove('show'), ms);
        }

        // --- Account: transcription time left today (free plan) ---
        // The main process keeps the count (account.js) and sends every change.
        let acct = null;
        function formatLeft(seconds) {
            const m = Math.floor(seconds / 60), h = Math.floor(m / 60);
            if (!h) return `${m} ${S('unit.min')}`;
            return m % 60 ? `${h} ${S('unit.h')} ${m % 60} ${S('unit.min')}` : `${h} ${S('unit.h')}`;
        }
        // Each account has its own 24 hours, from its first use: how long
        // until they renew, rounded up to the minute (null: none running yet).
        function untilReset() {
            if (!acct || !acct.resetsAt) return null;
            return formatLeft(Math.max(60, Math.ceil((acct.resetsAt - Date.now()) / 60000) * 60));
        }
        // "Осталось 43 мин, обновление через 4 ч 41 мин" — in plain sight,
        // not only on hover: not everyone would think of hovering.
        function accountLine() {
            const left = formatLeft(Math.max(0, freeSecondsLeft())), reset = untilReset();
            return reset ? S('account.leftReset').replace('{left}', left).replace('{t}', reset)
                         : S('account.left').replace('{left}', left);
        }
        function renderAccount(v) {
            if (v && acct && acct.signedIn && !v.signedIn) clearForSignOut();
            if (v) acct = v;
            const el = document.getElementById('minutes-left');
            const show = !!(acct && acct.signedIn && acct.limited);
            el.classList.toggle('hidden', !show);
            if (!show) return;
            el.textContent = el.title = accountLine();
            el.classList.toggle('empty', freeSecondsLeft() <= 0);
        }
        setInterval(() => renderAccount(), 30 * 1000); // the countdown moves on
        // No minutes left today: say so instead of recording what could not
        // be transcribed.
        // The free time is spent as recordings are made: what is left now is
        // the account's count less the recordings not counted yet (made, still
        // waiting for or in transcription — counted when their text comes).
        let uncountedSeconds = 0;
        function freeSecondsLeft() {
            if (!(acct && acct.signedIn && acct.limited)) return Infinity;
            return acct.remaining - uncountedSeconds;
        }
        function limitReached() {
            return freeSecondsLeft() <= 0;
        }
        if (window.api.onAccountUpdated) {
            window.api.onAccountUpdated(renderAccount);
            window.api.getAccount().then(renderAccount).catch(() => {});
        }

        // --- Speech model download / load (first run, or a new quality) ---
        // A strip under the title bar while the model is downloading (with the
        // size so far) or loading, or if the download failed (with Retry).
        // Hidden once a model is ready. Recordings made meanwhile wait their
        // turn and are transcribed as soon as the model is there.
        let lastEngine = null;
        const qualityName = (m) => ({
            base: S('quality.fast'), small: S('quality.standard'), 'large-v3-turbo': S('quality.accurate'),
        })[m] || m;
        function renderEngine(s) {
            lastEngine = s;
            if (s && s.translate && typeof renderTranslatePanel === 'function') {
                tpState = s.translate;
                renderTranslatePanel();
            }
            const banner = document.getElementById('engine-banner');
            const text = document.getElementById('engine-text');
            const bar = document.getElementById('engine-bar');
            const retry = document.getElementById('engine-retry');
            let show = true;
            banner.classList.remove('loading', 'error');
            retry.classList.add('hidden');
            if (s && s.state === 'downloading') {
                const mb = (b) => Math.round(b / 1e6);
                text.textContent = `${S('engine.downloading')} (${qualityName(s.job)}): ` +
                                   `${mb(s.done)} / ${mb(s.total)} ${S('unit.mb')}`;
                bar.style.width = (s.total ? (100 * s.done / s.total) : 0) + '%';
            } else if (s && s.state === 'loading') {
                banner.classList.add('loading');
                text.textContent = S('engine.loading');
            } else if (s && s.state === 'error') {
                banner.classList.add('error');
                text.textContent = s.error ? `${S('engine.error')}: ${s.error}` : S('engine.error');
                retry.textContent = S('engine.retry');
                retry.classList.remove('hidden');
            } else if (s && s.declined) {
                // The user stopped the download and there is no model yet.
                banner.classList.add('error');
                text.textContent = S('engine.none');
                retry.textContent = S('engine.download');
                retry.classList.remove('hidden');
            } else {
                show = false;
            }
            text.title = text.textContent;
            banner.classList.toggle('hidden', !show);
            // Move the history down by exactly the strip's height while it is shown.
            document.getElementById('main-content').style.paddingTop = show ? (32 + banner.offsetHeight) + 'px' : '';
        }
        if (window.api.onEngineStatus) {
            window.api.onEngineStatus(renderEngine);
            window.api.getEngineStatus().then(renderEngine).catch(() => {});
            document.getElementById('engine-retry').addEventListener('click', () => window.api.engineRetry());
            document.getElementById('engine-cancel').addEventListener('click', () => window.api.engineCancel());
        }

        // The button's own small meter: louder in the middle, a ripple across
        // (as on the bar); green, the microphone's red when loud.
        const BTN_EQ_WEIGHT = [0.55, 0.8, 0.95, 1, 0.95, 0.8, 0.55];
        let tick = 0;
        function drawButtonMeter(level) {
            const bars = document.getElementById('btn-eq').children;
            const t = performance.now();
            for (let i = 0; i < bars.length; i++) {
                const v = Math.max(0, Math.min(1, level * BTN_EQ_WEIGHT[i] * (0.75 + 0.35 * Math.sin(t / 90 + i * 0.9))));
                bars[i].style.height = Math.max(2, Math.round(v * 8)) + 'px';
                bars[i].style.backgroundColor = v > 0.8 ? 'var(--record-color)' : '';
            }
        }
        function startLevelMeter(mediaStream) {
            try {
                stopLevelMeter();
                _meterCtx = new (window.AudioContext || window.webkitAudioContext)();
                const src = _meterCtx.createMediaStreamSource(mediaStream);
                const analyser = _meterCtx.createAnalyser();
                analyser.fftSize = 512;
                src.connect(analyser);
                const buf = new Uint8Array(analyser.fftSize);
                _meterTimer = setInterval(() => {
                    analyser.getByteTimeDomainData(buf);
                    let sum = 0;
                    for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
                    const rms = Math.sqrt(sum / buf.length);
                    // Speech RMS is small and loudness is perceived logarithmically:
                    // gain it up, then bend the curve so quiet speech already moves
                    // the bars and only shouting reaches the red.
                    const level = Math.min(1, Math.pow(rms * 5, 0.65));
                    if (window.api.recLevel) window.api.recLevel(level);
                    if ((tick = (tick + 1) % 2) === 0) drawButtonMeter(level); // half as often: plenty for 8 px
                }, 33); // ~30fps keeps the meter feeling instant
            } catch (e) { console.error('level meter failed', e); }
        }
        function stopLevelMeter() {
            drawButtonMeter(0); // flat again for the next recording
            if (_meterTimer) { clearInterval(_meterTimer); _meterTimer = null; }
            if (_meterCtx) { try { _meterCtx.close(); } catch (e) {} _meterCtx = null; }
        }
        if (window.api && window.api.onHotkeyToggleRecord) {
            window.api.onHotkeyToggleRecord(() => {
                // Pressed again while the microphone is still opening: stop as
                // soon as it is open (a third press takes that back).
                if (micStarting) { stopWhenStarted = !stopWhenStarted; return; }
                if (mediaRecorder && mediaRecorder.state === 'recording') stopBtn.click();
                else recordBtn.click();
            });
        }

        // --- Functions ---
        function gatherAllText() {
            const entries = historyContainer.querySelectorAll('.history-entry');
            let fullText = S('history.header') + '\n\n';
            // No reverse() to sort from newest to oldest
            Array.from(entries).forEach(entry => {
                const timestamp = entry.querySelector('.entry-date')?.innerText || '';
                const original = entry.querySelector('.original-text')?.innerText || '';
                const translated = entry.querySelector('.translated-text')?.innerText || '';
                fullText += `${timestamp}\n`;
                fullText += `${S('history.original')}: ${original}\n`;
                if (translated) {
                    fullText += `${S('history.translation')}: ${translated}\n`;
                }
                fullText += '----------------------------------------\n\n';
            });
            return fullText;
        };



        function updateScrollButtons() {
            // Show scroll buttons only if content overflows
            const scrollableHeight = mainContent.scrollHeight - mainContent.clientHeight;

            // Keep the buttons inside the history, just above its bottom edge,
            // whatever sits below it (the translate panel grows and shrinks as
            // you search): measured from the history itself, not guessed. When
            // too little of the history shows for both buttons, leave them out.
            const area = mainContent.getBoundingClientRect();
            const visible = area.height - 32; // under the fixed title bar
            document.querySelector('.scroll-buttons').style.bottom =
                Math.round(window.innerHeight - area.bottom + 16) + 'px';

            if (scrollableHeight > 0 && visible >= 110) {
                // Show both buttons if scrollable
                scrollUpBtn.style.display = 'flex'; // Use flex to center SVG
                scrollDownBtn.style.display = 'flex'; // Use flex to center SVG

                // Hide scroll-up button if at the very top
                if (mainContent.scrollTop === 0) {
                    scrollUpBtn.style.display = 'none';
                }

                // Hide scroll-down button if at the very bottom
                if (mainContent.scrollTop >= scrollableHeight - 1) { // -1 for a small tolerance
                    scrollDownBtn.style.display = 'none';
                }
            } else {
                // Hide both buttons if not scrollable
                scrollUpBtn.style.display = 'none';
                scrollDownBtn.style.display = 'none';
            }
        }

        // Put a history text in a row with its own copy button. The button is
        // shown by the caller once the text is real (not a status or an error).
        // Its tooltip says which text it copies: the original or the translation.
        function withCopyButton(textEl, translation = false) {
            const row = document.createElement('div');
            row.className = 'text-row';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'entry-copy';
            // relabelled on a language change
            btn.dataset.i18nTitle = translation ? 'title.copyTranslation' : 'title.copyOriginal';
            btn.title = translation ? S('title.copyTranslation') : S('title.copyOriginal');
            btn.textContent = '\u{1F4CB}'; // clipboard
            btn.hidden = true;
            btn.addEventListener('click', () => {
                const text = textEl.innerText.trim();
                if (!text) return;
                navigator.clipboard.writeText(text).then(() => {
                    showToast(S('toast.copied'));
                    btn.textContent = '✓'; // brief tick as confirmation
                    setTimeout(() => { btn.textContent = '\u{1F4CB}'; }, 1000);
                }).catch(err => console.error('Failed to copy text:', err));
            });
            const actions = document.createElement('div');
            actions.className = 'entry-actions';
            actions.appendChild(btn);
            row.append(textEl, actions);
            return { row, btn, actions };
        }

        // When a recording was made, the way the app's language writes it:
        // "4 октября 2026 г. в 14:16:30", "October 4, 2026 at 2:16:30 PM",
        // "2026年10月4日 14:16:30" (it used the language of Windows instead).
        function formatStamp(date) {
            const lang = document.documentElement.lang || undefined;
            try {
                return new Intl.DateTimeFormat(lang, { dateStyle: 'long', timeStyle: 'medium' }).format(date);
            } catch (e) {
                return date.toLocaleString();
            }
        }
        // A new language: the dates and the "no speech" notes already in the
        // history change with it.
        function relabelHistory() {
            historyContainer.querySelectorAll('.history-entry').forEach((entry) => {
                const date = entry.querySelector('.entry-date');
                if (date && entry.dataset.isoTimestamp) date.textContent = formatStamp(new Date(entry.dataset.isoTimestamp));
            });
            historyContainer.querySelectorAll('.original-text[data-state="empty"]').forEach((el) => {
                el.textContent = S('status.noText');
            });
        }

        // A history entry for a recording that has just been stopped. It shows
        // at once, blinking "Транскрибация…", so several recordings in a row
        // are visible in order while they wait their turn.
        function addPendingEntry(date = new Date()) {
            const newEntry = document.createElement('div');
            newEntry.className = 'history-entry';
            newEntry.dataset.isoTimestamp = date.toISOString(); // Store machine-readable timestamp
            const originalTextField = document.createElement('div');
            originalTextField.className = 'original-text pending';
            originalTextField.textContent = S('status.transcribing');
            // The date; beside it, once the recording's file is there, ▶.
            const header = el('div', 'entry-header');
            header.appendChild(el('span', 'entry-date', formatStamp(date)));
            const play = el('button', 'entry-play');
            play.type = 'button';
            play.hidden = true;
            play.dataset.i18nTitle = 'title.play'; // relabelled on a language change
            play.title = S('title.play');
            play.innerHTML = PLAY_SVG;
            play.addEventListener('click', () => openRecording(newEntry));
            header.appendChild(play);
            newEntry.appendChild(header);
            const originalCopy = withCopyButton(originalTextField);
            // Under the copy button: a box to pick this text for translation
            // and saving (several can be picked and done in one go).
            const check = document.createElement('input');
            check.type = 'checkbox';
            check.className = 'entry-check';
            check.dataset.i18nTitle = 'translate.select'; // relabelled on a language change
            check.title = S('translate.select');
            check.hidden = true; // until the text is there
            check.addEventListener('change', updateTranslateTitle);
            originalCopy.actions.appendChild(check);
            newEntry.appendChild(originalCopy.row);
            historyContainer.insertBefore(newEntry, historyContainer.firstChild);
            updateScrollButtons(); // Update scroll buttons visibility
            return { originalTextField, originalCopy, check, play };
        }

        // --- Every recording is kept as a file (recordings.js in the main process) ---
        // Written as soon as it stops, in the folder from Settings (Downloads\Audiator
        // by default); ▶ beside its date opens it in the player Windows has. A
        // recording with no speech in it is taken back: no file, no ▶, as it has
        // no copy button or tick either. The files are the user's: signing out
        // or clearing the history leaves them where they are.
        const PLAY_SVG = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1 L9 5 L2 9 Z" fill="currentColor"/></svg>';
        // Once its file is there, the entry gets ▶ (and the file goes into the
        // kept history with it).
        function showPlay(entry) {
            (entry._saved || Promise.resolve(null)).then((r) => {
                if (!r || !r.file) return;
                entry.dataset.audio = r.file;
                const play = entry.querySelector('.entry-play');
                if (play) play.hidden = false;
            });
        }
        // No speech after all: that file goes again (only one this run wrote).
        function dropRecordingFile(entry) {
            (entry._saved || Promise.resolve(null)).then((r) => {
                if (r && r.file) window.api.discardRecording(r.file);
            });
        }
        async function openRecording(entry) {
            const r = await window.api.openFile(entry.dataset.audio);
            if (r && r.missing) showToast(S('toast.fileMissing'), 4000);
            else if (r && r.error) showToast(`${S('toast.openFailed')}: ${r.error}`, 5000);
        }

        // --- The history, kept between runs ---
        // The texts and translations go to the main process (which keeps them
        // encrypted on this computer, the last 1000) a moment after anything in
        // the history changes; they come back at the next start — with the path
        // of each one's recording, so ▶ still plays it. Not the sound itself,
        // and not entries that are only "no speech" or an error.
        let historyReady = false; // nothing is saved before what was kept is back
        function historySnapshot() {
            return [...historyContainer.querySelectorAll('.history-entry')].map((entry) => {
                const o = entry.querySelector('.original-text');
                if (!o || o.classList.contains('pending') || o.dataset.state || !o.textContent.trim()) return null;
                const t = entry.querySelector('.translated-text');
                const tr = t && t.textContent && t.textContent !== S('status.translating') ? t.textContent : null;
                return { t: entry.dataset.isoTimestamp, lang: entry.dataset.lang || null, text: o.textContent, tr,
                         a: entry.dataset.audio || null };
            }).filter(Boolean);
        }
        let historySaveTimer = null;
        new MutationObserver(() => {
            if (!historyReady) return;
            clearTimeout(historySaveTimer);
            historySaveTimer = setTimeout(() => window.api.saveHistory(historySnapshot()), 300);
        }).observe(historyContainer, { childList: true, subtree: true, characterData: true,
                                       attributes: true, attributeFilter: ['data-audio'] });

        async function restoreHistory() {
            try {
                const list = window.api.loadHistory ? await window.api.loadHistory() : [];
                for (const e of [...list].reverse()) { // oldest first: each new one goes on top
                    const p = addPendingEntry(new Date(e.t));
                    const entry = p.originalTextField.closest('.history-entry');
                    p.originalTextField.classList.remove('pending');
                    p.originalTextField.textContent = e.text;
                    if (e.lang) entry.dataset.lang = e.lang;
                    // Copy buttons start hidden until a text is there (withCopyButton):
                    // here it is, so show them — forgetting this left restored
                    // entries with no copy button.
                    p.originalCopy.btn.hidden = false;
                    p.check.hidden = false;
                    // ▶ for the recording's file; if it has since been moved
                    // or deleted, a click says so.
                    if (e.a) { entry.dataset.audio = e.a; p.play.hidden = false; }
                    if (e.tr) {
                        const tr = document.createElement('div');
                        tr.className = 'translated-text';
                        tr.textContent = e.tr;
                        const trCopy = withCopyButton(tr, true);
                        trCopy.btn.hidden = false;
                        entry.appendChild(trCopy.row);
                    }
                }
                updateActionButtons();
                updateScrollButtons();
            } catch (e) {
                console.error('history could not be restored', e);
            } finally {
                historyReady = true;
            }
        }

        // Recordings are transcribed one at a time, in the order they were
        // made: the transcripts come back in spoken order (the bar offers them
        // for Ctrl+V oldest first), and the local model is not split between
        // several recordings at once.
        let transcribeChain = Promise.resolve();
        // Transcriptions run one at a time: a recording made meanwhile says it
        // is waiting, and the running one shows how far it has got:
        // "Транскрибация… 41%" (the engine works in 30-second pieces, so the
        // percent moves in jumps; the blinking says it is at work meanwhile).
        let transcribing = 0;           // in the queue or running
        let progressField = null;       // the text field of the one running now
        if (window.api.onTranscribeProgress) {
            window.api.onTranscribeProgress((pct) => {
                if (progressField) progressField.textContent = `${S('status.transcribing')} ${pct}%`;
            });
        }
        function stopProgress(field) {
            if (progressField === field) progressField = null;
        }
        // blob: the recording as the user keeps it (webm); wav: the same
        // for the engine (startPcmCapture), or null if it could not be taken.
        function queueTranscription(blob, jobId, withinLimit, wav, seconds = 0) {
            uncountedSeconds += seconds; // spent, until its text comes and the account counts it
            const when = new Date(); // the entry's time, and its files' names
            const pending = addPendingEntry(when);
            // Its file now, before transcription: a failure there does not lose
            // the recording. (Stopped the instant it began: nothing to keep.)
            const entry = pending.originalTextField.closest('.history-entry');
            entry._saved = blob.size && window.api.saveRecording
                ? window.api.saveRecording(blob, when.toISOString()).catch((e) => ({ error: e.message }))
                : Promise.resolve(null);
            entry._saved.then((r) => {
                if (r && r.error) showToast(`${S('toast.audioFailed')}: ${r.error}`, 6000);
            });
            if (transcribing++ > 0) pending.originalTextField.textContent = S('status.queued');
            const gen = session;
            transcribeChain = transcribeChain
                // Recordings made before a sign-out are not transcribed after it.
                .then(() => (gen === session ? handleTranscription(blob, jobId, pending, gen, withinLimit, wav) : null))
                .finally(() => { uncountedSeconds = Math.max(0, uncountedSeconds - seconds); renderAccount(); })
                .catch((e) => console.error('transcription queue', e)) // keep the chain going
                .finally(() => { transcribing = Math.max(0, transcribing - 1); });
        }

        // The engine is given the recording as a plain 16 kHz mono WAV, taken
        // straight from the microphone while recording (an AudioContext at
        // 16 kHz resamples it; a small worklet collects the samples): it then
        // needs no audio library of its own — the one it had, PyAV, brings GPL
        // code into the installer — and gets the sound before any compression.
        // (Decoding the compressed recording afterwards, decodeAudioData,
        // crashed the window on a test machine, so it is not used.)
        const CAPTURE_WORKLET = `
            class PcmCapture extends AudioWorkletProcessor {
                constructor() {
                    super();
                    this.buf = new Float32Array(8000); this.n = 0;
                    this.port.onmessage = () => {   // "finish": hand over the rest
                        this.port.postMessage(this.buf.slice(0, this.n)); this.n = 0;
                        this.port.postMessage('done');
                    };
                }
                process(inputs) {
                    const ch = inputs[0] && inputs[0][0];
                    if (ch) for (let i = 0; i < ch.length; i++) {
                        this.buf[this.n++] = ch[i];
                        if (this.n === this.buf.length) { this.port.postMessage(this.buf); this.buf = new Float32Array(8000); this.n = 0; }
                    }
                    return true;
                }
            }
            registerProcessor('pcm-capture', PcmCapture);`;
        async function startPcmCapture(stream) {
            const ctx = new AudioContext({ sampleRate: 16000 });
            ctx.resume().catch(() => {});
            const url = URL.createObjectURL(new Blob([CAPTURE_WORKLET], { type: 'application/javascript' }));
            await ctx.audioWorklet.addModule(url);
            URL.revokeObjectURL(url);
            const node = new AudioWorkletNode(ctx, 'pcm-capture', { numberOfOutputs: 1 });
            const parts = [];
            let finished = null;
            node.port.onmessage = (e) => {
                if (e.data === 'done') { if (finished) finished(); } else parts.push(e.data);
            };
            ctx.createMediaStreamSource(stream).connect(node);
            node.connect(ctx.destination); // silent: it writes nothing; connected so it keeps running
            return {
                // The recording as WAV (16-bit, 16 kHz, mono); call once it stopped.
                finish: async () => {
                    // The last samples; never wait long for them (a stalled context).
                    await Promise.race([
                        new Promise((resolve) => { finished = resolve; node.port.postMessage('finish'); }),
                        new Promise((resolve) => setTimeout(resolve, 1500)),
                    ]);
                    ctx.close().catch(() => {});
                    let n = 0;
                    for (const p of parts) n += p.length;
                    const pcm = new Int16Array(n);
                    let o = 0;
                    for (const p of parts) for (let i = 0; i < p.length; i++) {
                        const v = Math.max(-1, Math.min(1, p[i]));
                        pcm[o++] = v < 0 ? v * 0x8000 : v * 0x7fff;
                    }
                    const head = new DataView(new ArrayBuffer(44));
                    const text = (at, str) => { for (let i = 0; i < str.length; i++) head.setUint8(at + i, str.charCodeAt(i)); };
                    text(0, 'RIFF'); head.setUint32(4, 36 + pcm.byteLength, true); text(8, 'WAVE');
                    text(12, 'fmt '); head.setUint32(16, 16, true); head.setUint16(20, 1, true); head.setUint16(22, 1, true);
                    head.setUint32(24, 16000, true); head.setUint32(28, 32000, true); head.setUint16(32, 2, true);
                    head.setUint16(34, 16, true); text(36, 'data'); head.setUint32(40, pcm.byteLength, true);
                    return new Blob([head.buffer, pcm.buffer], { type: 'audio/wav' });
                },
            };
        }

        // --- Signing out clears the history ---
        // Nothing of one account is left in the window for the next: the
        // history (texts, translations), a recording in progress and
        // transcriptions still waiting go. The main process empties the bar,
        // and the clipboard if it holds one of these texts. The files in the
        // user's folder stay: they belong to whoever uses this Windows account.
        let session = 0; // bumped at sign-out; work from before it is dropped
        function clearForSignOut() {
            session++;
            const texts = [...historyContainer.querySelectorAll('.original-text, .translated-text')]
                .map((e) => e.textContent.trim()).filter(Boolean);
            // Dropped in onstop; a microphone still opening is closed as soon as it opens.
            if (mediaRecorder && mediaRecorder.state === 'recording') stopBtn.click();
            historyContainer.innerHTML = '';
            closeTranslatePanel();
            updateTranslateTitle();
            updateActionButtons();
            updateScrollButtons();
            window.api.historyCleared(texts);
        }

        // A history entry that holds a real text — not waiting, transcribing,
        // "no speech" or an error.
        function hasText(entry) {
            const o = entry.querySelector('.original-text');
            return !!(o && !o.classList.contains('pending') && !o.dataset.state && o.textContent.trim());
        }
        // The newest of those: what "the latest" means for saving, copying and
        // translating. So those keep working on what is already there while a
        // new recording is made or transcribed, and move on to it once it is
        // done; a "no speech" or an error on top is passed over.
        function latestDoneEntry() {
            return [...historyContainer.querySelectorAll('.history-entry')].find(hasText) || null;
        }
        // Save and translate are usable as soon as there is a text, and stay
        // usable through new recordings.
        function updateActionButtons() {
            const done = latestDoneEntry();
            saveBtn.disabled = !done;
            translateBtn.disabled = !done;
        }

        async function handleTranscription(blob, jobId, { originalTextField, originalCopy, check }, gen, withinLimit, wav) {
            const entry = originalTextField.closest('.history-entry');
            originalTextField.textContent = S('status.transcribing'); // its turn now
            progressField = originalTextField;
            try {
                // Stopped the instant it began: nothing to send, nothing heard.
                const result = blob.size ? await window.api.transcribe(wav || blob, undefined, withinLimit)
                                         : { success: true, text: '' };
                stopProgress(originalTextField); // before its text goes in, or a tick would cover it
                if (gen !== session) return; // signed out while it was transcribed
                if (!result.success) {
                    // reason: the account's own refusal (limit, signed out),
                    // already a sentence for the user.
                    throw Object.assign(new Error(result.error || 'Transcription failed'), { reason: result.reason });
                }
                originalTextField.classList.remove('pending');
                originalTextField.textContent = result.text || S('status.noText');
                // The language Whisper heard: what a translation translates from.
                if (result.language) originalTextField.closest('.history-entry').dataset.lang = result.language;
                // Marked rather than detected by its wording, which now depends on the language.
                if (!result.text) originalTextField.dataset.state = 'empty';
                originalCopy.btn.hidden = !result.text;
                check.hidden = !result.text;
                // Its recording: ▶ with a text; with no speech it is not kept.
                if (result.text) showPlay(entry); else dropRecordingFile(entry);

                // Hand the transcript to the queue: on the clipboard at once when
                // this window is in front, otherwise when its barrel's turn comes.
                // An empty one just takes its barrel away.
                const handed = await window.api.transcribed(jobId, result.text || '');
                if (handed && handed.copied && document.hasFocus()) showToast(S('toast.copied'));

            } catch (error) {
                console.error('Transcription error:', error);
                originalTextField.classList.remove('pending');
                // Detailed logging of error information
                const errorMessage = error.reason ? error.message : `${S('error.transcribe')}: ${error.message}`;
                originalTextField.textContent = errorMessage;
                originalTextField.dataset.state = 'error';
                showPlay(entry); // the recording is kept: it can be listened to

                // Log detailed error information for debugging
                if (error.stack) {
                    console.error('Stack trace:', error.stack);
                }

                // Send error to main process for logging
                if (window.api && typeof window.api.logError === 'function') {
                    window.api.logError('Transcription error', error);
                }
                // Take the barrel away, or the bar would sit there saying it is
                // still transcribing.
                if (window.api.transcribeFailed) window.api.transcribeFailed(jobId);
            } finally {
                stopProgress(originalTextField);
                updateActionButtons(); // this one is now "the latest"
            }
        }

        // --- Event Listeners ---
        closeBtn.addEventListener('click', () => window.api.close());
        minimizeBtn.addEventListener('click', () => window.api.minimize());
        exitBtn.addEventListener('click', () => window.api.quit());

        document.body.addEventListener('click', (event) => {
            if (!appMenu.classList.contains('hidden') && !menuBtn.contains(event.target) && !appMenu.contains(event.target)) {
                appMenu.classList.add('hidden');
            }
        });

        menuBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            appMenu.classList.toggle('hidden');
        });
        
        settingsBtn.addEventListener('click', () => {
            window.api.openSettings();
            appMenu.classList.add('hidden');
        });
        document.getElementById('contact-btn').addEventListener('click', () => {
            window.api.openSupport();
            appMenu.classList.add('hidden');
        });

        clearAllBtn.addEventListener('click', async () => {
            appMenu.classList.add('hidden');
            if (await window.api.confirmBox(S('confirm.clearHistory'), S('dlg.clear'))) {
                historyContainer.innerHTML = '';
                updateScrollButtons(); // Update scroll buttons visibility
                updateActionButtons();
            }
        });

        // --- Save: the latest text, or the ticked ones — a file each ---
        // transcribe_135607_051026.txt in the folder from Settings, named like
        // the recording's own file; the date, the original and the translation
        // if there is one. The same tick picks texts for translating and saving.
        function entryFileText(entry) {
            const date = entry.querySelector('.entry-date')?.innerText || '';
            const original = entry.querySelector('.original-text')?.innerText || '';
            const translated = entry.querySelector('.translated-text')?.innerText || '';
            let text = `${date}\n\n${S('history.original')}: ${original}\n`;
            if (translated && translated !== S('status.translating')) {
                text += `${S('history.translation')}: ${translated}\n`;
            }
            return text;
        }
        saveBtn.addEventListener('click', async () => {
            const chosen = checkedEntries().filter(hasText);
            const entries = chosen.length ? chosen : [latestDoneEntry()].filter(Boolean);
            if (!entries.length) return;
            const r = await window.api.saveTexts(entries.map((e) => ({
                text: entryFileText(e), when: e.dataset.isoTimestamp, audio: e.dataset.audio || null,
            })));
            if (!r || r.error) {
                showToast(`${S('toast.saveFailed')}: ${(r && r.error) || ''}`, 6000);
                return;
            }
            entries.forEach((e) => { const box = e.querySelector('.entry-check'); if (box) box.checked = false; });
            updateTranslateTitle();
            const name = (p) => p.split(/[\\/]/).pop();
            const what = r.files.length === 1 ? S('toast.saved').replace('{name}', name(r.files[0]))
                                              : S('toast.savedN').replace('{n}', r.files.length);
            showToast(`${what}\n${r.folder}`, 4500);
        });

        // --- The translation language, chosen once ---
        // Picked in the list (clicking a language translates into it and makes
        // it the one), remembered on this computer. The Translate button then
        // translates straight into it, its code under the label; the arrow
        // beside the button opens the list to pick another. Not chosen yet, or
        // deleted since: the Translate button opens the list.
        let tpDefault = null;
        try { tpDefault = localStorage.getItem('translateDefault'); } catch (e) {}
        const installedLangs = () => (tpState && tpState.installed) || ['en'];
        const LANG_CODE = { pb: 'PT-BR', zt: 'ZH-TW' };
        function setDefaultLang(code) {
            tpDefault = code;
            try {
                if (code) localStorage.setItem('translateDefault', code);
                else localStorage.removeItem('translateDefault');
            } catch (e) {}
            renderTranslateButton();
        }
        function renderTranslateButton() {
            const ready = tpDefault && installedLangs().includes(tpDefault);
            document.getElementById('tb-lang').textContent = ready ? (LANG_CODE[tpDefault] || tpDefault.toUpperCase()) : '';
            fitTranslateLabel();
        }

        // The panel opens from the arrow (or from Translate while no language
        // is chosen); it closes with the arrow again, its own cross, Esc, or
        // after a translation went through.
        function openTranslatePanel() {
            translateBar.classList.remove('hidden');
            translatePick.classList.add('open');
            tpSearch.placeholder = S('translate.search');
            tpSearch.value = ''; // a fresh search each time the panel opens
            renderTranslatePanel();
            updateScrollButtons(); // Update scroll buttons position after opening the translate bar
        }
        function closeTranslatePanel() {
            translateBar.classList.add('hidden');
            translatePick.classList.remove('open');
            updateScrollButtons(); // Update scroll buttons position after hiding translate bar
        }
        translateBtn.addEventListener('click', () => {
            if (tpDefault && installedLangs().includes(tpDefault)) translateInto(tpDefault);
            else openTranslatePanel();
        });
        translatePick.addEventListener('click', () => {
            if (translateBar.classList.contains('hidden')) openTranslatePanel();
            else closeTranslatePanel();
        });
        document.getElementById('tp-close').addEventListener('click', closeTranslatePanel);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !translateBar.classList.contains('hidden')) closeTranslatePanel();
        });

        // Reset: a click unticks every transcript; a double click also removes
        // every translation from the history.
        const tpReset = document.getElementById('tp-reset');
        tpReset.addEventListener('click', () => {
            historyContainer.querySelectorAll('.entry-check:checked').forEach((c) => { c.checked = false; });
            updateTranslateTitle();
        });
        tpReset.addEventListener('dblclick', () => {
            historyContainer.querySelectorAll('.translated-text').forEach((t) => t.parentElement.remove());
            updateScrollButtons();
        });

        // The transcripts ticked for translation or saving, newest first (as listed).
        function checkedEntries() {
            return [...historyContainer.querySelectorAll('.entry-check:checked')]
                .map((c) => c.closest('.history-entry'));
        }
        // "Перевести на:" or "Перевести отмеченные (3) на:".
        function updateTranslateTitle() {
            const n = checkedEntries().length;
            document.getElementById('tp-title').textContent =
                n ? S('translate.toChecked').replace('{n}', n) : S('translate.to');
        }

        // Translate one transcript into `target`, from the language it was
        // spoken in. Returns 'ok', 'error', 'skip' (nothing to translate),
        // { noLang: true }, or { missing: code } when a language has to be
        // installed first (the entry is then left as it was).
        async function translateEntry(entry, target) {
            const originalEl = entry.querySelector('.original-text');
            const originalText = originalEl?.innerText;
            // Skip entries that hold an error or 'nothing recognised' rather than speech.
            if (!originalText || originalEl.dataset.state || originalEl.classList.contains('pending')) return 'skip';
            const source = entry.dataset.lang;
            if (!source) return { noLang: true };

            let translatedDiv = entry.querySelector('.translated-text');
            const hadTranslation = !!translatedDiv;
            if (!translatedDiv) {
                translatedDiv = document.createElement('div');
                translatedDiv.className = 'translated-text';
                entry.appendChild(withCopyButton(translatedDiv, true).row);
            }
            const translatedCopyBtn = translatedDiv.parentElement.querySelector('.entry-copy');
            const previous = translatedDiv.textContent;
            translatedCopyBtn.hidden = true; // until the new translation arrives
            translatedDiv.textContent = S('status.translating');

            try {
                const result = await window.api.translate(originalText, target, source);
                if (!result.success && result.missing) {
                    // Put things back; the panel asks for the missing language.
                    if (hadTranslation) { translatedDiv.textContent = previous; translatedCopyBtn.hidden = !previous; }
                    else translatedDiv.parentElement.remove();
                    return { missing: result.missing };
                }
                if (!result.success) {
                    throw new Error(result.error || S('error.translate'));
                }
                translatedDiv.textContent = result.translatedText || S('error.translate');
                translatedCopyBtn.hidden = !result.translatedText;
                return 'ok';
            } catch (error) {
                console.error('Translation error:', error);
                translatedDiv.textContent = `${S('error.translate')}: ${error.message}`;
                if (window.api && typeof window.api.logError === 'function') {
                    window.api.logError('Translation error', error);
                }
                return 'error';
            }
        }

        // Translate the ticked transcripts — or, with none ticked, the latest —
        // into `target`, one after another. Those done are unticked; if some
        // need a language that is not installed, the panel stays open and
        // offers it, and their ticks stay for another go once it is in.
        async function translateInto(target) {
            const chosen = checkedEntries();
            const entries = chosen.length ? chosen
                : [latestDoneEntry()].filter(Boolean);
            const missing = new Set();
            let noLang = false, failed = false;
            for (const entry of entries) {
                const r = await translateEntry(entry, target);
                if (r && r.missing) { missing.add(r.missing); continue; }
                if (r && r.noLang) { noLang = true; continue; }
                if (r === 'error') failed = true;
                const box = entry.querySelector('.entry-check');
                if (box) box.checked = false;
            }
            updateTranslateTitle();
            if (missing.size) {
                tpNeed = [...missing];
                if (translateBar.classList.contains('hidden')) openTranslatePanel(); // from the button: show what is needed
