                showTranslateNote(`${S('translate.needLanguage')} ${tpNeed.map((c) => langName(c)).join(', ')}`);
                return;
            }
            if (noLang) {
                if (translateBar.classList.contains('hidden')) openTranslatePanel();
                showTranslateNote(S('translate.noLang'));
                return;
            }
            tpNeed = [];
            hideTranslateNote();
            if (!failed) closeTranslatePanel();
        }

        // --- Translation panel: languages on demand ---
        const tpInstalled = document.getElementById('tp-installed');
        const tpJob = document.getElementById('tp-job');
        const tpNote = document.getElementById('tp-note');
        const tpSearch = document.getElementById('tp-search');
        const tpResults = document.getElementById('tp-results');
        let tpCatalog = [];     // [{ code, name, size }]: every language on offer
        let tpState = null;     // the engine's translate status
        let tpNeed = [];        // languages the last translation needed
        // Favourite languages (a per-computer preference): listed first.
        let tpFavorites = new Set();
        try { tpFavorites = new Set(JSON.parse(localStorage.getItem('translateFavorites') || '[]')); } catch (e) {}
        function toggleFavorite(code) {
            if (tpFavorites.has(code)) tpFavorites.delete(code); else tpFavorites.add(code);
            try { localStorage.setItem('translateFavorites', JSON.stringify([...tpFavorites])); } catch (e) {}
            renderTranslatePanel();
            tpInstalled.scrollTop = 0; // favourites are at the top: show them
        }

        // Argos codes that are not plain language tags.
        const ARGOS_TAG = { pb: 'pt-BR', zt: 'zh-Hant', zh: 'zh-Hans' };
        function langName(code, inLanguage) {
            try {
                const tag = ARGOS_TAG[code] || code;
                const n = new Intl.DisplayNames([inLanguage || document.documentElement.lang || 'en'], { type: 'language' }).of(tag);
                return n ? n.charAt(0).toUpperCase() + n.slice(1) : code;
            } catch (e) { return code; }
        }
        const sizeOf = (code) => (tpCatalog.find((c) => c.code === code) || {}).size || 0;
        const mbText = (bytes) => Math.round(bytes / 1e6) + ' ' + S('unit.mb');
        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined) e.textContent = text;
            return e;
        }
        const DOWNLOAD_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1 .5 7.97"/><path d="M12 11v9"/><path d="m9 17 3 3 3-3"/></svg>';

        function showTranslateNote(text) { tpNote.textContent = text; tpNote.classList.remove('hidden'); renderTranslatePanel(); }
        function hideTranslateNote() { tpNote.classList.add('hidden'); updateScrollButtons(); }

        function installLanguage(code) {
            window.api.translateInstall(code);
        }
        async function deleteLanguage(code) {
            const what = `${langName(code)} (${mbText(sizeOf(code))})`;
            if (!(await window.api.confirmBox(`${S('translate.confirmDelete')} ${what}?`, S('dlg.delete')))) return;
            if (code === tpDefault) setDefaultLang(null); // Translate asks again next time
            window.api.translateDelete(code).then((s) => renderEngine(s));
        }

        // A row offering a language that is not installed: its size and a
        // download button.
        function offerRow(code) {
            const row = el('div', 'tp-row');
            row.append(el('span', 'tp-name', langName(code)), el('span', 'tp-size', mbText(sizeOf(code))));
            const dl = el('button', 'tp-icon tp-download');
            dl.type = 'button';
            dl.title = S('engine.download');
            dl.innerHTML = DOWNLOAD_SVG;
            dl.addEventListener('click', () => installLanguage(code));
            row.appendChild(dl);
            return row;
        }

        function renderTranslatePanel() {
            const t = tpState || { installed: ['en'], job: null, state: 'idle' };
            // Favourites first, in the order they were starred (the first star
            // on top); then English; then the rest by name.
            const starOrder = [...tpFavorites];
            const rank = (c) => (tpFavorites.has(c) ? 0 : c === 'en' ? 1 : 2);
            const installed = (t.installed || ['en']).slice().sort((a, b) =>
                rank(a) - rank(b) ||
                (rank(a) === 0 ? starOrder.indexOf(a) - starOrder.indexOf(b) : langName(a).localeCompare(langName(b))));

            // Languages on this computer: click one to translate into it \u2014 it
            // becomes the Translate button's language (framed).
            renderTranslateButton();
            tpInstalled.textContent = '';
            for (const code of installed) {
                const row = el('div', 'tp-row tp-lang' + (code === tpDefault ? ' tp-default' : ''));
                const fav = tpFavorites.has(code);
                const star = el('button', 'tp-star' + (fav ? ' on' : ''), '\u2605');
                star.type = 'button';
                star.title = fav ? S('translate.unfavorite') : S('translate.favorite');
                star.addEventListener('click', () => toggleFavorite(code));
                row.appendChild(star);
                const name = el('button', 'tp-name', langName(code));
                name.type = 'button';
                name.title = code === tpDefault ? S('translate.isDefault') : S('translate.clickToTranslate');
                name.addEventListener('click', () => {
                    setDefaultLang(code);
                    renderTranslatePanel(); // the frame moves to it at once
                    translateInto(code);
                });
                row.appendChild(name);
                if (code === 'en') {
                    row.append(el('span', 'tp-size', S('translate.builtIn')), el('span', 'tp-icon'));
                } else {
                    row.appendChild(el('span', 'tp-size', mbText(sizeOf(code))));
                    const del = el('button', 'tp-icon tp-delete', '\u2715');
                    del.type = 'button';
                    del.title = S('quality.delete');
                    del.addEventListener('click', () => deleteLanguage(code));
                    row.appendChild(del);
                }
                tpInstalled.appendChild(row);
            }

            // Downloads: the language in progress (bar, size, stop), those
            // waiting behind it (each can be taken out of the queue), and any
            // that failed (retry, or dismiss).
            updateTranslateTitle();
            tpJob.textContent = '';
            const iconButton = (cls, text, title, onClick) => {
                const b = el('button', 'tp-icon ' + cls, text);
                b.type = 'button';
                b.title = title;
                b.addEventListener('click', onClick);
                return b;
            };
            if (t.job) {
                const row = el('div', 'tp-row' + (t.state === 'installing' ? ' tp-installing' : ''));
                row.appendChild(el('span', 'tp-name', langName(t.job)));
                const bar = el('div', 'tp-progress');
                const fill = el('i');
                fill.style.width = t.total ? (100 * t.done / t.total) + '%' : '0';
                bar.appendChild(fill);
                row.appendChild(bar);
                row.appendChild(el('span', 'tp-size', t.state === 'installing'
                    ? S('translate.installing')
                    : `${Math.round(t.done / 1e6)} / ${mbText(t.total)}`));
                row.appendChild(t.state === 'downloading'
                    ? iconButton('tp-cancel', '\u2715', S('engine.cancel'), () => window.api.translateCancel(t.job))
                    : el('span', 'tp-icon'));
                tpJob.appendChild(row);
            }
            for (const code of t.queue || []) {
                const row = el('div', 'tp-row');
                row.append(el('span', 'tp-name', langName(code)),
                           el('span', 'tp-size', `${S('translate.queued')} \u00b7 ${mbText(sizeOf(code))}`),
                           iconButton('tp-cancel', '\u2715', S('translate.unqueue'), () => window.api.translateCancel(code)));
                tpJob.appendChild(row);
            }
            for (const [code, why] of Object.entries(t.failed || {})) {
                const row = el('div', 'tp-row');
                const msg = el('span', 'tp-name', `${langName(code)}: ${S('translate.error')}`);
                msg.title = why;
                const again = iconButton('tp-download', '', S('engine.retry'), () => installLanguage(code));
                again.innerHTML = DOWNLOAD_SVG;
                row.append(msg, again, iconButton('tp-cancel', '\u2715', S('translate.dismiss'), () => window.api.translateCancel(code)));
                tpJob.appendChild(row);
            }

            // Adding a language: the one a translation asked for, then matches
            // of the search by name (in the interface language, in its own
            // language, in English) or code.
            tpResults.textContent = '';
            const offered = new Set([...installed, t.job, ...(t.queue || []), ...Object.keys(t.failed || {})].filter(Boolean));
            const rows = [];
            for (const code of tpNeed) if (!offered.has(code)) { rows.push(code); offered.add(code); }
            const q = tpSearch.value.trim().toLowerCase();
            if (q) {
                const all = tpCatalog.filter((c) => [
                    langName(c.code), langName(c.code, ARGOS_TAG[c.code] || c.code), c.name, c.code,
                ].some((n) => String(n).toLowerCase().includes(q)));
                const matches = all.filter((c) => !offered.has(c.code));
                matches.sort((a, b) => langName(a.code).localeCompare(langName(b.code)));
                rows.push(...matches.slice(0, 6).map((c) => c.code));
                // "Nothing found" only when no language matches at all — not when
                // the match is already installed or downloading above.
                if (!all.length && !rows.length) tpResults.appendChild(el('div', 'tp-empty', S('translate.noResults')));
            }
            rows.forEach((code) => tpResults.appendChild(offerRow(code)));
            // Once every language a translation needed is in, its note goes.
            if (tpNeed.length && tpNeed.every((c) => installed.includes(c))) { tpNeed = []; hideTranslateNote(); }
            // Three rows per list on their own; two each once downloads or
            // search results share the panel.
            translateBar.classList.toggle('compact', tpJob.children.length > 0 || tpResults.children.length > 0);
            // The panel's height just changed: keep the scroll buttons inside
            // the history (the ResizeObserver below covers everything else).
            updateScrollButtons();
        }

        tpSearch.addEventListener('input', renderTranslatePanel);
        window.api.translateCatalog().then((c) => { tpCatalog = c || []; renderTranslatePanel(); });

        copyBtn.addEventListener('click', () => {
            const selection = window.getSelection().toString().trim();
            let textToCopy = '';

            if (selection) {
                textToCopy = selection;
            } else {
                const latestEntry = latestDoneEntry();
                if (latestEntry) {
                    textToCopy = latestEntry.querySelector('.original-text')?.innerText;
                    const translatedText = latestEntry.querySelector('.translated-text')?.innerText;
                    if (translatedText) {
                        textToCopy += `\n${translatedText}`;
                    }
                }
            }
            
            if (textToCopy) {
                navigator.clipboard.writeText(textToCopy).catch(err => console.error('Failed to copy text:', err));
            }
        });

        saveAllBtn.addEventListener('click', () => {
            const textToSave = gatherAllText();
            if (textToSave) { 
                const isoTimestamp = new Date().toISOString(); // Use current time for "save all"
                window.api.saveText(textToSave, isoTimestamp); 
            }
            appMenu.classList.add('hidden');
        });
        
        // Each recording keeps its own stream and audio, and carries one id to
        // the main process from start to transcript (the bar's barrels). Stop
        // and record again can come faster than the previous recording finishes
        // closing, so nothing here is shared between recordings.
        // Opening the microphone takes a moment. A second press in that moment
        // used to start a second recording on top of the first, which then
        // could never be stopped: a "recording" barrel that never went away
        // and held back every barrel behind it. Now there is only ever one.
        let jobCounter = 0;
        let micStarting = false;     // the microphone is being opened
        let stopWhenStarted = false; // the user asked to stop before it was open
        recordBtn.addEventListener('click', async () => {
            if (micStarting || (mediaRecorder && mediaRecorder.state === 'recording')) return;
            if (limitReached()) {
                window.api.limitReached(); // brings this window up when the hotkey was used
                showToast(S('error.limit').replace('{t}', untilReset() || formatLeft(0)), 5000);
                return;
            }
            const withinLimit = true; // free time was left at the start
            // The free plan's time runs out during the recording: it stops by
            // itself at that moment (the user's rule: the limit is a limit),
            // and what was recorded until then is transcribed.
            const budget = freeSecondsLeft();
            micStarting = true;
            stopWhenStarted = false;
            const gen = session; // signed out meanwhile: this recording is dropped
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                if (gen !== session) { stream.getTracks().forEach((t) => t.stop()); return; }
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                const jobId = ++jobCounter;
                mediaRecorder = recorder;

                recorder.ondataavailable = (event) => { chunks.push(event.data); };
                let capture = null; // the same sound as WAV for the engine (startPcmCapture)
                let startedAt = 0, limitTimer = null;
                recorder.onstop = async () => {
                    clearInterval(limitTimer);
                    const seconds = startedAt ? (Date.now() - startedAt) / 1000 : 0;
                    const wav = capture ? await capture.finish().catch((e) => { console.error('capture', e); return null; }) : null;
                    stream.getTracks().forEach(track => track.stop());
                    if (gen !== session) return;
                    if (window.api.recordingStopped) window.api.recordingStopped(jobId);
                    queueTranscription(new Blob(chunks, { type: 'audio/webm' }), jobId, withinLimit, wav, seconds);
                };

                recordBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');

                recorder.start();
                try {
                    capture = await startPcmCapture(stream);
                } catch (e) {
                    console.error('could not take the sound for the engine; the recording goes as it is', e);
                }
                startLevelMeter(stream);
                startedAt = Date.now();
                if (budget !== Infinity) {
                    limitTimer = setInterval(() => {
                        if ((Date.now() - startedAt) / 1000 < budget || recorder.state !== 'recording') return;
                        clearInterval(limitTimer);
                        if (mediaRecorder === recorder) stopBtn.click(); else recorder.stop();
                        window.api.limitReached(); // brings this window up: the user is often in another app
                        showToast(S('error.limitStopped').replace('{t}', untilReset() || formatLeft(0)), 8000);
                    }, 250);
                }
                if (window.api.recordingStarted) window.api.recordingStarted(jobId);
                micStarting = false;
                if (stopWhenStarted) stopBtn.click();
            } catch (err) {
                console.error("Error accessing microphone:", err);
            } finally {
                micStarting = false;
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            stopLevelMeter(); // here, not in onstop: a new recording may already be metering
            stopBtn.classList.add('hidden');
            recordBtn.classList.remove('hidden');
        });

        // --- Scroll Button Event Listeners ---
        scrollUpBtn.addEventListener('click', () => {
            mainContent.scrollTo({ top: 0, behavior: 'smooth' });
        });

        scrollDownBtn.addEventListener('click', () => {
            mainContent.scrollTo({ top: mainContent.scrollHeight, behavior: 'smooth' });
        });

        mainContent.addEventListener('scroll', updateScrollButtons);
        // The history grows and shrinks as the panels below it change (search
        // results, downloads, notes): keep the scroll buttons inside it.
        new ResizeObserver(() => updateScrollButtons()).observe(mainContent);
        // Initial check for scroll button visibility
        updateScrollButtons();

        // --- Settings Listener ---
        window.api.onSettingsUpdated((settings) => {
            applyI18n(); // the language may have changed with these settings
            if (settings.theme === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
            document.documentElement.style.setProperty('--main-font-size', `${settings.fontSize || 16}px`);
            document.documentElement.style.setProperty('--main-font-family', settings.fontFamily || 'Arial, sans-serif');
        });

        // --- Apply initial settings on page load ---
        window.api.getSettings().then(initialSettings => {
            if (initialSettings && initialSettings.theme) {
                if (initialSettings.theme === 'light') {
                    document.body.classList.add('light-theme');
                } else {
                    document.body.classList.remove('light-theme');
                }
                document.documentElement.style.setProperty('--main-font-size', `${initialSettings.fontSize || 16}px`);
                document.documentElement.style.setProperty('--main-font-family', initialSettings.fontFamily || 'Arial, sans-serif');
            }
            // The strings may have arrived before the font did; re-fit for the real font.
            fitTranslateLabel();
        }).catch(error => {
            console.error('Failed to load initial settings:', error);
        });
    </script>
</body>
</html>
