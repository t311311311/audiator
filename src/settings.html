<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Настройки</title>
    <style id="theme-style">
        :root {
            --bg-color: #282c34;
            --primary-color: #3e4452;
            --text-color: #abb2bf;
            --border-color: #4b5263;
            --accent-color: #61afef;
        }
        body.light-theme {
            --bg-color: #fafafa;
            --primary-color: #e4e6eb;
            --text-color: #1c1e21;
            --border-color: #d1d5db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px 20px; /* 16, not 20, above and below: everything fits a 14" laptop at 125 % (766 px) */
            user-select: none;
            overflow-y: auto; /* only when the screen is too small for the window */
            display: flex;
            flex-direction: column;
            height: calc(100vh - 32px);
        }
        h2 {
            margin-top: 0;
        }
        .content {
            flex-grow: 1;
        }
        .setting {
            margin-bottom: 8px; /* 8: the recording device's line under it still fits a 14" laptop (766 px) */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label {
            margin-right: 15px;
            min-width: 100px;
        }
        select, input[type="range"], input[type="text"], input[type="password"] {
            background-color: var(--primary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px;
            flex-grow: 1;
        }
        select:focus-visible, input[type="range"]:focus-visible, input[type="text"]:focus-visible, input[type="password"]:focus-visible {
            outline: 2px solid white;
            outline-offset: 0px;
        }
        /* The sliders in the window's colours, not Chromium's own violet (owner,
           2026-10-09, AUD-49): a thin track in the border colour, the part up
           to the value in the accent colour (--fill, set by paintRange), a
           round accent thumb. */
        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            background: transparent; border: none; padding: 0; height: 18px; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 4px; border-radius: 2px;
            background: linear-gradient(to right, var(--accent-color) 0 var(--fill, 50%), var(--border-color) var(--fill, 50%) 100%);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; border: none;
            background: var(--accent-color);
        }
        #font-size-slider-wrapper {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }
        #font-size-slider {
            margin-right: 10px;
        }
        /* A label above a full-width drop-down, with a line under it: what to
           record, and the recognition quality. */
        .setting.stacked { flex-direction: column; align-items: stretch; }
        .setting.stacked > label { margin-bottom: 6px; }
        /* Delete a downloaded model (not the one in use) to free disk space:
           a link at the end of the line under the quality list. */
        .quality-delete { margin-left: 4px; color: var(--accent-color); text-decoration: none; cursor: pointer; }
        .quality-delete:hover { color: #e06c75; text-decoration: underline; }
        .setting-hint {
            margin-top: 3px;
            font-size: 0.8em;
            opacity: 0.75;
            line-height: 1.35;
        }
        /* Account (owner's mock-ups 2026-10-09, AUD-47): who is signed in, the
           plan (not for a paid one: "Paid until" says it), time left today in
           two lines; on the right a column of three buttons of one width —
           Pay (not on unlimited plans), Contact us, Sign out. */
        .account-box {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            background: var(--primary-color); border: 1px solid var(--border-color); border-radius: 4px;
        }
        .account-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .account-email { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
        .account-plan, .account-left { font-size: 0.85em; }
        .account-plan { opacity: 0.8; }
        /* A line each: "1 h 46 min left," / "renews in 15 h 1 min" — never
           broken inside "renews in". */
        .account-left > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .account-left.empty { color: #e06c75; }
        .account-actions { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
        .account-actions .action-button { padding: 4px 10px; font-size: 0.85em; white-space: nowrap; }
        .account-actions .action-button[hidden] { display: none; }
        /* The folder for recordings and texts: its path (the start cut with "…"
           when long — the end is the part that tells), change, open. */
        .folder-box {
            display: flex; align-items: center; gap: 8px; padding: 6px 8px;
            background: var(--primary-color); border: 1px solid var(--border-color); border-radius: 4px;
        }
        .folder-path { flex: 1 1 auto; min-width: 0; font-size: 0.85em; white-space: nowrap; overflow: hidden; user-select: text; }
        .folder-box .action-button { flex: 0 0 auto; padding: 4px 10px; font-size: 0.85em; white-space: nowrap; }
        .settings-version { margin-right: auto; font-size: 0.8em; line-height: 1.5; }
        .settings-version a { color: var(--accent-color); text-decoration: none; }
        .settings-version a:hover { text-decoration: underline; }
        .settings-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }
        .action-button {
            background-color: var(--primary-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 15px;
            cursor: pointer;
        }
        .action-button:hover {
            background-color: var(--border-color);
        }
        .action-button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }
    </style>
    <script>
        // Immediately apply theme based on localStorage or default
        (function() {
            // This is a placeholder - we'll inject the actual theme via IPC later
            // For now, we'll just make sure the element exists for later manipulation
        })();
    </script>
</head>
<body>
    <div class="content">
        <h2 style="margin-top: 0; margin-left: 15px; margin-bottom: 10px;" data-i18n="settings.title">Настройки</h2>

        <!-- First, so someone who cannot read the current language still finds it:
             the globe is universal and every option is in its own language. -->
        <div class="setting">
            <label for="language-select">🌐 <span data-i18n="settings.language">Язык</span></label>
            <select id="language-select"></select>
        </div>

        <div class="setting">
            <label for="theme-select" data-i18n="settings.theme">Тема</label>
            <select id="theme-select">
                <option value="system" data-i18n="settings.themeSystem">Как в Windows (по умолчанию)</option>
                <option value="dark" data-i18n="settings.themeDark">Темная</option>
                <option value="light" data-i18n="settings.themeLight">Светлая</option>
            </select>
        </div>

        <div class="setting">
            <label for="font-family-select" data-i18n="settings.font">Шрифт</label>
            <select id="font-family-select">
                <option value="Arial, sans-serif">Arial</option>
                <option value="Verdana, sans-serif">Verdana</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">System UI</option>
            </select>
        </div>
        
        <div class="setting">
            <label for="font-size-slider" data-i18n="settings.fontSize">Размер шрифта</label>
            <div id="font-size-slider-wrapper">
                <input type="range" id="font-size-slider" min="10" max="24" step="1">
                <span id="font-size-value">16px</span>
            </div>
        </div>

            <div class="setting">
                <label for="opacity-slider" data-i18n="settings.opacity">Прозрачность</label>
                <input type="range" id="opacity-slider" min="0.2" max="1.0" step="0.05">
            </div>

            <!-- The recording device: the microphone, the computer's own sound
                 (whatever plays: a video, a call, a game — taken digitally), or
                 both; a short line under it says which (user's wording,
                 2026-10-06). Applies to the next recording after Save. -->
            <div class="setting stacked">
                <label for="source-select" data-i18n="settings.source">Выбрать устройство для записи</label>
                <select id="source-select">
                    <option value="mic" data-i18n="settings.sourceMic">Микрофон</option>
                    <option value="system" data-i18n="settings.sourceSystem">Звук компьютера</option>
                    <option value="both" data-i18n="settings.sourceBoth">Микрофон + звук компьютера</option>
                </select>
                <div class="setting-hint" id="source-hint"></div>
            </div>

            <!-- The speech model, a drop-down like the others (owner 2026-10-09,
                 AUD-48): each entry with its size and a tick once it is on this
                 computer. A model not yet here is downloaded after Save; the main
                 window shows the progress. -->
            <div class="setting stacked">
                <label for="quality-select" data-i18n="settings.quality">Качество распознавания</label>
                <select id="quality-select"></select>
                <div class="setting-hint"><span id="quality-hint"></span><a href="#" class="quality-delete" id="quality-delete" hidden></a></div>
            </div>

            <!-- Where every recording and the saved texts go (Downloads\Audiator by
                 default). Another folder applies on Save; files already there stay. -->
            <div class="setting stacked">
                <label data-i18n="settings.folder">Папка для записей и текстов</label>
                <div class="folder-box">
                    <div class="folder-path" id="folder-path"></div>
                    <button class="action-button" id="folder-change" data-i18n="settings.folderChange">Изменить…</button>
                    <button class="action-button" id="folder-open" data-i18n="settings.folderOpen">Открыть</button>
                </div>
            </div>

            <div class="setting stacked">
                <label data-i18n="account.title">Аккаунт</label>
                <div class="account-box">
                    <div class="account-info">
                        <div class="account-email" id="account-email"></div>
                        <div class="account-plan" id="account-plan"></div>
                        <div class="account-left" id="account-left"></div>
                    </div>
                    <div class="account-actions">
                        <button class="action-button" id="pay-btn" data-i18n="account.pay" hidden>Оплатить</button>
                        <button class="action-button" id="support-btn" data-i18n="menu.contact">Написать нам</button>
                        <button class="action-button" id="sign-out-btn" data-i18n="account.signOut">Выйти из аккаунта</button>
                    </div>
                </div>
            </div>


            <!-- The version sits on the buttons' line, so the window ends right
                 under them instead of keeping a strip for it at the bottom. -->
            <div class="settings-actions">
                <div class="settings-version">
                    <div><span data-i18n="settings.version">Версия:</span> <span id="app-version"></span></div>
                    <a href="#" id="terms-link" data-i18n="login.termsLink">Правила использования</a>
                </div>
                <button class="action-button" id="cancel-settings-btn" data-i18n="settings.cancel">Отмена</button>
                <button class="action-button" id="save-settings-btn" data-i18n="settings.save">Сохранить</button>
            </div>

            <script>
                const themeSelect = document.getElementById('theme-select');
                const fontFamilySelect = document.getElementById('font-family-select');
                const opacitySlider = document.getElementById('opacity-slider');
                const fontSizeSlider = document.getElementById('font-size-slider');
                const fontSizeValue = document.getElementById('font-size-value');
                const saveSettingsBtn = document.getElementById('save-settings-btn');
                const cancelSettingsBtn = document.getElementById('cancel-settings-btn');

                let currentSettings = {};

                // --- Real-time preview listeners ---
                themeSelect.addEventListener('change', (e) => {
                    currentSettings.theme = e.target.value;
                    window.settingsApi.send('update-setting', { key: 'theme', value: e.target.value });
                    applyTheme(e.target.value); // Apply theme to settings window itself
                });

                // The line under the recording device: what the chosen one records.
                function renderSourceHint() {
                    const v = document.getElementById('source-select').value;
                    document.getElementById('source-hint').textContent = ({
                        mic: strings['settings.sourceMicHint'], system: strings['settings.sourceSystemHint'], both: strings['settings.sourceBothHint'],
                    })[v] || '';
                }
                document.getElementById('source-select').addEventListener('change', (e) => {
                    currentSettings.recordSource = e.target.value; // for the next recording, after Save
                    renderSourceHint();
                });

                fontFamilySelect.addEventListener('change', (e) => {
                    currentSettings.fontFamily = e.target.value;
                    window.settingsApi.send('update-setting', { key: 'fontFamily', value: e.target.value });
                });

                // The accent part of a slider's track goes up to its value.
                function paintRange(el) {
                    const p = (el.value - el.min) / (el.max - el.min) * 100;
                    el.style.setProperty('--fill', `${Math.max(0, Math.min(100, p))}%`);
                }
                function paintRanges() { paintRange(fontSizeSlider); paintRange(opacitySlider); }

                fontSizeSlider.addEventListener('input', (e) => {
                    paintRange(e.target);
                    const size = parseInt(e.target.value);
                    currentSettings.fontSize = size;
                    fontSizeValue.textContent = `${size}px`;
                    window.settingsApi.send('update-setting', { key: 'fontSize', value: size });
                });

                opacitySlider.addEventListener('input', (e) => {
                    paintRange(e.target);
                    currentSettings.opacity = parseFloat(e.target.value);
                    window.settingsApi.send('update-setting', { key: 'opacity', value: parseFloat(e.target.value) });
                });

                // The microphone's processing for calls: for the next recording, after Save.

                // --- Save and Cancel ---
                saveSettingsBtn.addEventListener('click', () => {
                    window.settingsApi.send('save-all-settings', currentSettings);
                });

                cancelSettingsBtn.addEventListener('click', () => {
                    window.settingsApi.send('close-settings-window');
                });

                // A font saved before the list had full CSS values (a plain
                // "Arial" from older versions) still shows as its entry.
                function setFontFamily(value) {
                    fontFamilySelect.value = value || 'Arial, sans-serif';
                    if (fontFamilySelect.selectedIndex < 0) {
                        const name = String(value || '').split(',')[0].replace(/['"]/g, '').trim();
                        const match = [...fontFamilySelect.options].find((o) => o.textContent === name);
                        fontFamilySelect.value = match ? match.value : 'Arial, sans-serif';
                    }
                }

                // --- Load Initial Settings ---
                // "system": as Windows is now (light or dark apps), and on the fly when it changes.
                const darkWindows = window.matchMedia('(prefers-color-scheme: dark)');
                function applyTheme(theme) {
                    const light = theme === 'light' || (theme === 'system' && !darkWindows.matches);
                    document.body.classList.toggle('light-theme', light);
                }
                darkWindows.addEventListener('change', () => { if (currentSettings.theme === 'system') applyTheme('system'); });
                // The main process sends the theme resolved and the choice beside it:
                // the page works with the choice (what is shown, what Save keeps).
                function takeSettings(s) {
                    const c = { ...s, theme: s.themeChoice || s.theme || 'system' };
                    delete c.themeChoice;
                    return c;
                }

                // Handle initial settings received from main process
                window.settingsApi.onInitialSettings((initialSettings) => {
                    // Apply theme immediately to prevent flashing
                    // Store initial settings
                    currentSettings = takeSettings(initialSettings);
                    applyTheme(currentSettings.theme);

                    // Update UI elements with initial values
                    themeSelect.value = currentSettings.theme;
                    setFontFamily(initialSettings.fontFamily);
                    document.getElementById('source-select').value = initialSettings.recordSource || 'mic';
                    renderSourceHint();
                    opacitySlider.value = initialSettings.opacity || 0.8;
                    fontSizeSlider.value = initialSettings.fontSize || 14;
                    fontSizeValue.textContent = `${initialSettings.fontSize || 14}px`;
                    paintRanges();
                });

                window.settingsApi.receive('settings-loaded', (settings) => {
                    currentSettings = takeSettings(settings);
                    themeSelect.value = currentSettings.theme;
                    setFontFamily(settings.fontFamily);
                    document.getElementById('source-select').value = settings.recordSource || 'mic';
                    renderSourceHint();
                    opacitySlider.value = settings.opacity || 0.8;
                    fontSizeSlider.value = settings.fontSize || 14;
                    fontSizeValue.textContent = `${settings.fontSize || 14}px`;
                    paintRanges();
                    applyTheme(currentSettings.theme); // Apply theme to settings window itself
                    renderQuality();
                    renderFolder();
                });

                window.settingsApi.send('get-settings');

                // --- Interface language (AUD-33) ---
                const languageSelect = document.getElementById('language-select');
                let strings = {};
                let appVersion = null; // null = still loading, false = unavailable

                function renderVersion() {
                    const el = document.getElementById('app-version');
                    if (appVersion === null) el.textContent = strings['settings.loading'] || '';
                    else if (appVersion === false) el.textContent = strings['settings.unknown'] || '';
                    else el.textContent = appVersion;
                }

                function applyI18n(lang) {
                    return window.settingsApi.getI18n(lang).then((i18n) => {
                        strings = i18n.strings;
                        document.documentElement.lang = i18n.lang;
                        document.title = strings['settings.title'] || document.title;
                        document.querySelectorAll('[data-i18n]').forEach((el) => {
                            const s = strings[el.dataset.i18n];
                            if (s !== undefined) el.textContent = s;
                        });
                        // Each language is listed in its own script, so a user
                        // who cannot read the current one still finds theirs.
                        if (!languageSelect.options.length) {
                            for (const [code, name] of Object.entries(i18n.languages)) {
                                languageSelect.add(new Option(name, code));
                            }
                        }
                        languageSelect.value = i18n.lang;
                        renderSourceHint();
                        renderVersion();
                    });
                }

                languageSelect.addEventListener('change', (e) => {
                    currentSettings.language = e.target.value;
                    applyI18n(e.target.value).then(() => { renderQuality(); renderAccount(); renderFolder(); }); // preview here; other windows follow on Save
                });

                applyI18n().then(() => { renderQuality(); renderAccount(); renderFolder(); });

                // --- Recognition quality (the speech model) ---
                // A drop-down: each model with its size and a tick once it is on
                // this computer. The line below says what the chosen one means,
                // whether it is installed, and offers to delete it when it is
                // downloaded but not in use.
                const qualitySelect = document.getElementById('quality-select');
                const qualityHint = document.getElementById('quality-hint');
                const qualityDelete = document.getElementById('quality-delete');
                const QUALITY = ['base', 'small', 'large-v3-turbo'];
                let engineStatus = null;

                const qualityName = (m) => ({
                    base: strings['quality.fast'],
                    small: strings['quality.standard'],
                    'large-v3-turbo': strings['quality.accurate'],
                })[m] || m;
                const qualityHintText = (m) => ({
                    base: strings['quality.hintFast'],
                    small: strings['quality.hintStandard'],
                    'large-v3-turbo': strings['quality.hintAccurate'],
                })[m] || '';
                function formatSize(bytes) {
                    const lang = document.documentElement.lang;
                    if (bytes >= 1e9) {
                        return (bytes / 1e9).toLocaleString(lang, { maximumFractionDigits: 1 }) + '\u00A0' + strings['unit.gb'];
                    }
                    return Math.round(bytes / 1e6) + '\u00A0' + strings['unit.mb'];
                }

                qualitySelect.addEventListener('change', () => {
                    currentSettings.whisperModel = qualitySelect.value; // applied on Save
                    renderQuality();
                });

                async function deleteQuality(m, info) {
                    const what = qualityName(m) + (info.size ? ` (${formatSize(info.size)})` : '');
                    // A system dialog, not confirm(): that left the page's fields dead afterwards.
                    if (!(await window.settingsApi.confirmBox(`${strings['quality.confirmDelete']} ${what}?`,
                        strings['dlg.delete'], document.documentElement.lang))) return;
                    window.settingsApi.deleteModel(m).then((s) => { engineStatus = s; renderQuality(); });
                }
                qualityDelete.addEventListener('click', (e) => {
                    e.preventDefault();
                    const m = qualitySelect.value;
                    const info = ((engineStatus && engineStatus.models) || {})[m];
                    if (info && info.installed) deleteQuality(m, info);
                });

                function renderQuality() {
                    const models = (engineStatus && engineStatus.models) || {};
                    const inUse = engineStatus && engineStatus.model;
                    const job = engineStatus && engineStatus.job;
                    const chosen = currentSettings.whisperModel || 'small';
                    qualitySelect.textContent = '';
                    for (const m of QUALITY) {
                        const info = models[m] || {};
                        const text = qualityName(m) + (m === 'small' ? ` (${strings['settings.default']})` : '')
                            + (info.size ? ` \u00B7 ${formatSize(info.size)}` : '') + (info.installed ? '  \u2713' : '');
                        qualitySelect.add(new Option(text, m, false, m === chosen));
                    }
                    qualitySelect.value = chosen;
                    const info = models[chosen];
                    // What hovering says: installed and in use, installed but not
                    // in use (Save switches to it), or not yet here.
                    qualitySelect.title = !info || !info.installed ? (strings['quality.tipNotInstalled'] || '')
                        : chosen === inUse ? strings['quality.tipInUse'] : strings['quality.tipInstalled'];
                    let hint = qualityHintText(chosen);
                    if (info) hint += ' ' + (info.installed ? strings['quality.installed'] : strings['quality.toDownload']);
                    qualityHint.textContent = hint;
                    qualityDelete.textContent = strings['quality.delete'] || '';
                    qualityDelete.hidden = !(info && info.installed && chosen !== inUse && chosen !== job);
                }

                window.settingsApi.getEngineStatus().then((s) => { engineStatus = s; renderQuality(); });
                window.settingsApi.onEngineStatus((s) => { engineStatus = s; renderQuality(); });

                // --- Account ---
                // The free plan shows the time left today; a commercial one,
                // until when it is paid; unlimited ones, nothing more.
                let account = null;
                function formatLeft(seconds) {
                    // A no-break space between a number and its unit: never "4" at a
                    // line's end and "ч" on the next.
                    const m = Math.floor(seconds / 60), h = Math.floor(m / 60), nb = ' ';
                    if (!h) return `${m}${nb}${strings['unit.min']}`;
                    return m % 60 ? `${h}${nb}${strings['unit.h']} ${m % 60}${nb}${strings['unit.min']}` : `${h}${nb}${strings['unit.h']}`;
                }
                function renderAccount(v) {
                    if (v) account = v;
                    if (!account || !account.signedIn) return; // signing out closes this window
                    document.getElementById('account-email').textContent = account.email;
                    document.getElementById('account-email').title = account.email;
                    // A paid plan says "Paid until …" instead (owner's mock-up).
                    const plan = document.getElementById('account-plan');
                    plan.textContent = strings[`plan.${account.plan}`] || account.plan;
                    plan.hidden = account.plan === 'commercial' && !!account.paidUntil;
                    const left = document.getElementById('account-left');
                    const lines = [];
                    // 24 hours just over: all the time back at once (as in the main window).
                    const over = !!account.resetsAt && Date.now() >= account.resetsAt;
                    const remaining = over ? account.limit : account.remaining;
                    const empty = !!account.limited && remaining <= 0;
                    if (account.limited) {
                        // Left in the account's own 24 hours, and when they
                        // renew (once the first use has started them): two lines.
                        const l = formatLeft(remaining);
                        lines.push(...(account.resetsAt && !over
                            ? (strings['account.leftResetLines'] || '').replace('{left}', l).replace('{t}',
                                formatLeft(Math.max(60, Math.ceil((account.resetsAt - Date.now()) / 60000) * 60)))
                            : (strings['account.left'] || '').replace('{left}', l)).split('\n'));
                    } else if (account.plan === 'commercial' && account.paidUntil) {
                        const d = new Date(account.paidUntil).toLocaleDateString(document.documentElement.lang);
                        lines.push((strings['account.paidUntil'] || '').replace('{d}', d));
                    }
                    // Less than a month, waiting for the next payment (auth-server/billing.py).
                    if (account.balance > 0 && (account.plan === 'free' || account.plan === 'commercial')) {
                        lines.push((strings['account.balance'] || '').replace('{b}',
                            Number(account.balance).toLocaleString(document.documentElement.lang, { maximumFractionDigits: 2 })));
                    }
                    left.replaceChildren(...lines.map((t) => { const d = document.createElement('div'); d.textContent = t; return d; }));
                    left.hidden = !lines.length;
                    left.classList.toggle('empty', empty);
                    // Pay on the free and the paid plan; nothing to pay on unlimited and admin.
                    document.getElementById('pay-btn').hidden = !(account.plan === 'free' || account.plan === 'commercial');
                }
                setInterval(() => renderAccount(), 30 * 1000); // the countdown moves on
                window.settingsApi.getAccount().then(renderAccount).catch(() => {});
                window.settingsApi.onAccountUpdated(renderAccount);
                // Signing out is also how to change accounts: the sign-in window
                // comes up and takes any email.
                document.getElementById('support-btn').addEventListener('click', () => {
                    window.settingsApi.openSupport(document.documentElement.lang);
                });
                document.getElementById('pay-btn').addEventListener('click', () => {
                    window.settingsApi.openPay(document.documentElement.lang);
                });
                document.getElementById('terms-link').addEventListener('click', (e) => {
                    e.preventDefault();
                    window.settingsApi.openTerms(document.documentElement.lang);
                });
                document.getElementById('sign-out-btn').addEventListener('click', async () => {
                    if (await window.settingsApi.confirmBox(strings['account.confirmSignOut'], strings['account.signOut'],
                        document.documentElement.lang)) window.settingsApi.signOut();
                });

                // --- The folder for recordings and texts ---
                // The one in use until another is picked; the pick is kept on Save
                // (currentSettings.saveFolder), like everything else here.
                let folderInUse = '';
                const folderPath = document.getElementById('folder-path');
                const shownFolder = () => currentSettings.saveFolder || folderInUse;
                // The whole path when it fits; else the drive, "…", and as many
                // of the last folders as fit: C:\…\Downloads\Audiator.
                function renderFolder() {
                    const full = shownFolder();
                    folderPath.title = full;
                    folderPath.textContent = full;
                    const parts = full.split('\\');
                    for (let i = 1; folderPath.scrollWidth > folderPath.clientWidth && i < parts.length - 1; i++) {
                        folderPath.textContent = [parts[0], '…', ...parts.slice(i + 1)].join('\\');
                    }
                }
                if (window.settingsApi.getSaveFolder) window.settingsApi.getSaveFolder().then((f) => { folderInUse = f; renderFolder(); }).catch(() => {});
                document.getElementById('folder-change').addEventListener('click', async () => {
                    const picked = await window.settingsApi.chooseFolder(shownFolder(), document.documentElement.lang);
                    if (picked) { currentSettings.saveFolder = picked; renderFolder(); } // applied on Save
                });
                document.getElementById('folder-open').addEventListener('click', () => {
                    window.settingsApi.openFolder(shownFolder());
                });
                window.addEventListener('resize', renderFolder);

                // Load and display app version
                window.settingsApi.getAppVersion().then(version => {
                    appVersion = version;
                    renderVersion();
                }).catch(error => {
                    console.error('Failed to get app version:', error);
                    appVersion = false;
                    renderVersion();
                });

                // ESC key handler
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') {
                        window.settingsApi.send('close-settings-window');
                    }
                });
            </script></body>
