<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      -webkit-user-select: none; cursor: pointer;
    }
    .bar {
      display: flex; align-items: center; gap: 6px; height: 100%; box-sizing: border-box;
      padding: 0 8px; background: #23262e; border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }
    .mic { flex: 0 0 auto; width: 13px; height: 13px; color: #e06c75; }
    .mic svg { width: 100%; height: 100%; display: block; }
    /* Pulse so it reads as "recording" even in silence. */
    .rec { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    /* Status text replaces the equaliser between recording and the result.
       Two short lines keep the bar the same size at only 96px wide. */
    .status {
      display: none; flex: 1 1 auto; font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 9px; line-height: 1.15; text-align: center; letter-spacing: -0.2px;
    }
    .status b { display: block; font-weight: 600; }

    /* Transcription running: red, softly breathing. */
    body.is-busy .eq, body.is-busy .mic { display: none; }
    body.is-busy .status { display: block; color: #e06c75; animation: blink 1.1s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Result ready: green, glowing. */
    body.is-done .eq, body.is-done .mic { display: none; }
    body.is-done .status {
      display: block; color: #98c379;
      text-shadow: 0 0 6px rgba(152, 195, 121, 0.9), 0 0 12px rgba(152, 195, 121, 0.5);
      animation: glow 1.6s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 5px rgba(152,195,121,0.75), 0 0 10px rgba(152,195,121,0.35); }
      50%      { text-shadow: 0 0 9px rgba(152,195,121,1),    0 0 18px rgba(152,195,121,0.6); }
    }

    .eq { flex: 1 1 auto; display: flex; align-items: center; gap: 1.5px; height: 20px; }
    .eq i {
      display: block; flex: 1 1 0; height: 2px; min-height: 2px; border-radius: 1px;
      background: #3ec46d; transform-origin: center;
      /* Snappy: the meter should feel instant, so keep transitions very short. */
      transition: height 0.04s linear, background-color 0.08s linear;
    }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="mic rec" id="mic">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
      </svg>
    </div>
    <div class="eq" id="eq"></div>
    <div class="status" id="status"><b>Выполняется</b><b>транскрибация!</b></div>
  </div>

  <script>
    const BARS = 16;
    const eq = document.getElementById('eq');
    const bars = [];
    for (let i = 0; i < BARS; i++) { const b = document.createElement('i'); eq.appendChild(b); bars.push(b); }

    // Per-bar weights so the middle reacts more than the edges (equaliser look).
    const weight = bars.map((_, i) => {
      const d = Math.abs(i - (BARS - 1) / 2) / ((BARS - 1) / 2); // 0 centre .. 1 edge
      return 0.45 + 0.55 * (1 - d * d);
    });

    let level = 0;      // smoothed level 0..1
    const MAX_H = 20;   // px, matches .eq height

    function render() {
      const t = performance.now();
      for (let i = 0; i < BARS; i++) {
        // Two detuned waves per bar: the ripple travels along the equaliser
        // instead of every bar wobbling in lockstep.
        const jitter = 0.72 + 0.42 * Math.sin(t / 90 + i * 0.7)
                            + 0.16 * Math.sin(t / 47 - i * 1.3);
        const v = Math.max(0, Math.min(1, level * weight[i] * jitter));
        bars[i].style.height = Math.max(2, Math.round(v * MAX_H)) + 'px';
        // green (120) -> yellow (60) -> red (0) as it gets louder
        bars[i].style.backgroundColor = 'hsl(' + Math.round(120 * (1 - v)) + ', 85%, 52%)';
      }
      level *= 0.82; // quicker fall-off, so peaks read as distinct hits
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // The bar walks through three states without changing size:
    // recording (equaliser) -> transcribing (red) -> ready (green).
    const statusEl = document.getElementById('status');
    function setState(cls, line1, line2) {
      level = 0;
      document.body.classList.remove('is-busy', 'is-done');
      if (cls) {
        statusEl.innerHTML = '';
        const a = document.createElement('b'); a.textContent = line1;
        const b = document.createElement('b'); b.textContent = line2;
        statusEl.append(a, b);
        document.body.classList.add(cls);
      }
    }

    if (window.overlay && window.overlay.onLevel) {
      window.overlay.onLevel((v) => { if (v > level) level = v; }); // fast attack, slow release
      window.overlay.onBusy(() => setState('is-busy', 'Выполняется', 'транскрибация!'));
      window.overlay.onDone(() => setState('is-done', 'Готово!', 'Ctrl+V'));
      window.overlay.onReset(() => setState(null));
    }

    // Clicking the bar hands control back to the main window. mousedown as well
    // as click: some window styles deliver one but not the other. The main
    // process also treats focus as a click, so this is belt and braces.
    function handoff(e) {
      e.preventDefault();
      if (window.overlay && window.overlay.clicked) window.overlay.clicked();
      else console.error('overlay bridge missing - preload did not load');
    }
    const barEl = document.getElementById('bar');
    barEl.addEventListener('mousedown', handoff);
    barEl.addEventListener('click', handoff);
  </script>
</body>
</html>
