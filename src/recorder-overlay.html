<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      -webkit-user-select: none; cursor: grab; /* click: open the window; drag: move */
    }
    body.dragging { cursor: grabbing; }
    /* One barrel per recording not yet dealt with, oldest on the left. The
       main process sizes the window to fit them; a lone barrel looks exactly
       like the single bar did before. */
    .row { display: flex; gap: 6px; height: 100%; }
    /* Half see-through, so a barrel over a button or a line of text no longer
       hides it (users asked for it to be transparent). Fully transparent was
       tried: the barrel's own "Ctrl+V" then mixed with the text under it and
       neither could be read; at about half the text below shows through and
       the barrel still reads. */
    .bar {
      flex: 0 0 96px; display: flex; align-items: center; gap: 6px; height: 100%;
      box-sizing: border-box; padding: 0 8px; background: rgba(35, 38, 46, 0.55); border-radius: 20px;
      border: 1px solid rgba(160, 170, 185, 0.6);
    }
    /* Numbered barrels (more than one in the queue) are a little wider, so the
       number fits beside the two lines of text. Keep in step with index.js. */
    .numbered .bar { flex-basis: 112px; padding-left: 6px; }
    .num {
      flex: 0 0 auto; width: 14px; height: 14px; border-radius: 7px;
      background: rgba(35, 38, 46, 0.55); color: #e6e8ee;
      font: 600 9px/14px 'Segoe UI', Tahoma, sans-serif; text-align: center;
    }
    /* "+N": barrels hidden in the middle of a long queue. */
    .numbered .bar.more, .bar.more {
      flex: 0 0 34px; justify-content: center; padding: 0;
      color: #e6e8ee; font: 600 11px 'Segoe UI', Tahoma, sans-serif;
    }
    .mic { flex: 0 0 auto; width: 13px; height: 13px; color: #e06c75; }
    .mic svg { width: 100%; height: 100%; display: block; }
    /* Pulse so it reads as "recording" even in silence.
       Every animation on the bar moves in a few steps, not smoothly: the bar
       is an always-on-top see-through window, and redrawing it 60 times a
       second for a glow took about a third of a CPU core in two processes —
       while a "Ctrl+V" barrel waited, transcription ran that much slower
       (measured: glow 34 % + 30 %, in steps 6 % + 13 %). */
    .rec { animation: pulse 1.4s steps(4) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    /* Status text replaces the equaliser between recording and the result.
       Two short lines keep the barrel the same size. */
    .status {
      flex: 1 1 auto; font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 9px; line-height: 1.15; text-align: center; letter-spacing: -0.2px;
    }
    .status b { display: block; font-weight: 600; }

    /* Transcription running: red, softly breathing. */
    .busy .status { color: #e06c75; animation: blink 1.1s steps(4) infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Result ready: green, glowing. */
    .done .status {
      color: #98c379;
      text-shadow: 0 0 6px rgba(152, 195, 121, 0.9), 0 0 12px rgba(152, 195, 121, 0.5);
      animation: glow 1.6s steps(4) infinite;
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 5px rgba(152,195,121,0.75), 0 0 10px rgba(152,195,121,0.35); }
      50%      { text-shadow: 0 0 9px rgba(152,195,121,1),    0 0 18px rgba(152,195,121,0.6); }
    }

    .eq { flex: 1 1 auto; display: flex; align-items: center; gap: 1.5px; height: 20px; }
    .eq i {
      display: block; flex: 1 1 0; height: 2px; min-height: 2px; border-radius: 1px;
      background: #3ec46d; transform-origin: center;
      /* Snappy: the meter should feel instant, so keep transitions very short. */
      transition: height 0.04s linear, background-color 0.08s linear;
    }
  </style>
</head>
<body>
  <div class="row" id="row"></div>

  <script>
    const MIC_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
      '<path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>' +
      '<path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
    const BARS = 16;
    const MAX_H = 20;   // px, matches .eq height
    // Per-bar weights so the middle reacts more than the edges (equaliser look).
    const weight = Array.from({ length: BARS }, (_, i) => {
      const d = Math.abs(i - (BARS - 1) / 2) / ((BARS - 1) / 2); // 0 centre .. 1 edge
      return 0.45 + 0.55 * (1 - d * d);
    });

    let bars = [];      // the equaliser of the barrel that is recording, if any
    let level = 0;      // smoothed level 0..1

    function render() {
      const t = performance.now();
      for (let i = 0; i < bars.length; i++) {
        // Two detuned waves per bar: the ripple travels along the equaliser
        // instead of every bar wobbling in lockstep.
        const jitter = 0.72 + 0.42 * Math.sin(t / 90 + i * 0.7)
                            + 0.16 * Math.sin(t / 47 - i * 1.3);
        const v = Math.max(0, Math.min(1, level * weight[i] * jitter));
        bars[i].style.height = Math.max(2, Math.round(v * MAX_H)) + 'px';
        // green (120) -> yellow (60) -> red (0) as it gets louder
        bars[i].style.backgroundColor = 'hsl(' + Math.round(120 * (1 - v)) + ', 85%, 52%)';
      }
      level *= 0.82; // quicker fall-off, so peaks read as distinct hits
      // Only while a barrel is recording: this loop ran every frame for good
      // and kept the bar's process busy with nothing to draw.
      if (bars.length) requestAnimationFrame(render); else looping = false;
    }
    let looping = false;
    function startMeter() {
      if (!looping && bars.length) { looping = true; requestAnimationFrame(render); }
    }

    function statusLines(lines) {
      const s = document.createElement('div');
      s.className = 'status';
      for (const line of lines) {
        const b = document.createElement('b');
        b.textContent = line;
        s.appendChild(b);
      }
      return s;
    }

    // Redraw the row of barrels. Skipped when nothing changed, so the
    // blinking and glowing do not restart on every update.
    const rowEl = document.getElementById('row');
    let drawn = '';
    function draw(state) {
      if (state.hint) rowEl.title = state.hint; // "Нажмите — открыть окно. Перетащите — передвинуть"
      const key = JSON.stringify([state.items, state.numbered, state.busy, state.done, state.progress]);
      if (key === drawn) return;
      drawn = key;
      rowEl.textContent = '';
      document.body.classList.toggle('numbered', !!state.numbered);
      bars = [];
      let progressShown = false;
      for (const item of state.items) {
        const bar = document.createElement('div');
        if (item.more) {
          bar.className = 'bar more';
          bar.textContent = '+' + item.more;
          rowEl.appendChild(bar);
          continue;
        }
        bar.className = 'bar ' + item.state;
        if (state.numbered) {
          const num = document.createElement('div');
          num.className = 'num';
          num.textContent = item.number;
          bar.appendChild(num);
        }
        if (item.state === 'recording') {
          const mic = document.createElement('div');
          mic.className = 'mic rec';
          mic.innerHTML = MIC_SVG;
          const eq = document.createElement('div');
          eq.className = 'eq';
          for (let i = 0; i < BARS; i++) { const b = document.createElement('i'); eq.appendChild(b); bars.push(b); }
          bar.append(mic, eq);
        } else if (item.state === 'busy' && state.progress != null && !progressShown) {
          // The one being transcribed now: how far it has got.
          progressShown = true;
          bar.appendChild(statusLines([state.transcribing, state.progress + '%']));
        } else {
          bar.appendChild(statusLines(item.state === 'done' ? state.done : state.busy));
        }
        rowEl.appendChild(bar);
      }
      startMeter();
    }

    if (window.overlay && window.overlay.onLevel) {
      window.overlay.onLevel((v) => { if (v > level) level = v; }); // fast attack, slow release
      window.overlay.onState(draw);
    }

    // A click on the bar hands control back to the main window; pressing and
    // moving drags the bar somewhere else on the screen (it can cover what the
    // user needs to see). Told apart by distance: under 4 px it is a click.
    // The pointer is captured, so a fast drag that outruns the bar still
    // follows; positions are in screen pixels, which the moving window does
    // not change.
    let press = null; // { x, y, dragging }
    rowEl.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !window.overlay) return;
      e.preventDefault();
      press = { x: e.screenX, y: e.screenY, dragging: false };
      try { rowEl.setPointerCapture(e.pointerId); } catch (err) { /* synthetic events */ }
      window.overlay.dragStart();
    });
    rowEl.addEventListener('pointermove', (e) => {
      if (!press) return;
      const dx = e.screenX - press.x, dy = e.screenY - press.y;
      if (!press.dragging && Math.hypot(dx, dy) < 4) return;
      press.dragging = true;
      document.body.classList.add('dragging');
      window.overlay.dragMove(dx, dy);
    });
    function release() {
      if (!press) return;
      const dragged = press.dragging;
      press = null;
      document.body.classList.remove('dragging');
      if (dragged) window.overlay.dragEnd();
      else window.overlay.clicked();
    }
    rowEl.addEventListener('pointerup', release);
    rowEl.addEventListener('pointercancel', () => { if (press && press.dragging) window.overlay.dragEnd(); press = null; document.body.classList.remove('dragging'); });
  </script>
</body>
</html>
