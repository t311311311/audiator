<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      -webkit-user-select: none; cursor: pointer;
    }
    .bar {
      display: flex; align-items: center; gap: 6px; height: 100%; box-sizing: border-box;
      padding: 0 8px; background: #23262e; border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }
    .mic { flex: 0 0 auto; width: 13px; height: 13px; color: #e06c75; }
    .mic svg { width: 100%; height: 100%; display: block; }
    /* Pulse so it reads as "recording" even in silence. */
    .rec { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    /* "Copied" confirmation replaces the equaliser for a moment. */
    .done {
      display: none; flex: 1 1 auto; font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 9px; color: #98c379; white-space: nowrap; text-align: center;
      letter-spacing: -0.2px; /* the bar is only 96px wide */
    }
    body.is-done .eq { display: none; }
    body.is-done .done { display: block; }
    body.is-done .mic { color: #98c379; animation: none; }

    .eq { flex: 1 1 auto; display: flex; align-items: center; gap: 1.5px; height: 20px; }
    .eq i {
      display: block; flex: 1 1 0; height: 2px; min-height: 2px; border-radius: 1px;
      background: #3ec46d; transform-origin: center;
      /* Snappy: the meter should feel instant, so keep transitions very short. */
      transition: height 0.04s linear, background-color 0.08s linear;
    }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="mic rec" id="mic">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
        <path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
      </svg>
    </div>
    <div class="eq" id="eq"></div>
    <div class="done" id="done">Скопировано</div>
  </div>

  <script>
    const BARS = 16;
    const eq = document.getElementById('eq');
    const bars = [];
    for (let i = 0; i < BARS; i++) { const b = document.createElement('i'); eq.appendChild(b); bars.push(b); }

    // Per-bar weights so the middle reacts more than the edges (equaliser look).
    const weight = bars.map((_, i) => {
      const d = Math.abs(i - (BARS - 1) / 2) / ((BARS - 1) / 2); // 0 centre .. 1 edge
      return 0.45 + 0.55 * (1 - d * d);
    });

    let level = 0;      // smoothed level 0..1
    const MAX_H = 20;   // px, matches .eq height

    function render() {
      const t = performance.now();
      for (let i = 0; i < BARS; i++) {
        // Two detuned waves per bar: the ripple travels along the equaliser
        // instead of every bar wobbling in lockstep.
        const jitter = 0.72 + 0.42 * Math.sin(t / 90 + i * 0.7)
                            + 0.16 * Math.sin(t / 47 - i * 1.3);
        const v = Math.max(0, Math.min(1, level * weight[i] * jitter));
        bars[i].style.height = Math.max(2, Math.round(v * MAX_H)) + 'px';
        // green (120) -> yellow (60) -> red (0) as it gets louder
        bars[i].style.backgroundColor = 'hsl(' + Math.round(120 * (1 - v)) + ', 85%, 52%)';
      }
      level *= 0.82; // quicker fall-off, so peaks read as distinct hits
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    if (window.overlay && window.overlay.onLevel) {
      window.overlay.onLevel((v) => { if (v > level) level = v; }); // fast attack, slow release
      window.overlay.onDone(() => { level = 0; document.body.classList.add('is-done'); });
      window.overlay.onReset(() => document.body.classList.remove('is-done'));
    }

    // Clicking the bar hands control back to the main window.
    document.getElementById('bar').addEventListener('click', () => {
      if (window.overlay && window.overlay.clicked) window.overlay.clicked();
    });
  </script>
</body>
</html>
